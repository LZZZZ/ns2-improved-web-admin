  "/#request=getmods":
    get:
      tags: [mods]
      operationId: getMods
      x-request: getmods
      summary: Search the Steam workshop (asynchronous, poll until settled)
      description: |
        `ServerWebInterface.lua:217-274`. The Lua handler cannot block, so the
        first call **starts** `Server.SearchWorshop` (the spelling is UWE's)
        and returns `{"loading": true}` immediately. Poll the same URL until
        the reply is something else.

        What the engine does, measured on 09-26 (REQUIREMENTS item 4):

        - **At most 50 hits, and the page is ignored.** Pages 1, 2, 3 and 500
          of one search were the same 50 items, so there is no paging: a
          search that finds more shows its first 50 only. The engine logs the
          total (`numMatching = 2874`) but does not hand it to Lua.
        - Relevance order: `combat fix` puts Combat Fix first.
        - The callback gets one table. An empty one means no matches **or a
          search Steam failed** (`Failed Steam error NoConnection` with the
          rig offline, answered at once); nothing tells the two apart.
        - A search answers in 0.3-0.9 s.

        Stock, as vanilla has it:

        - Completed results are cached for **60 s**, keyed by
          `searchtext .. page` -- so `a` page 11 and `a1` page 1 share a key.
        - A search still running after **30 s** is treated as timed out and
          restarted, so a client can poll forever without ever settling.
        - An empty result is `{"items": []}` (this spec said `{}` until it was
          measured: dkjson writes an empty table as `[]`).
        - Omitting `searchtext` is worse than useless: no search is started,
          so the reply is `{"loading": true}` forever. A `p` that is not a
          number is a Lua error, answered with an empty `200`.

        **With the mod** (CONSTRAINTS item 2): the loading reply carries
        `elapsed`; a settled one carries `done`, `page`, `count` and `capped`
        (50 hits: there may be more); a search with no answer after 30 s is
        reported once, with `error`, instead of restarting silently; a missing
        `searchtext` searches for everything; `p` is read as a whole number
        from 1 to 1000, else 1; the cache key separates text and page. `items`
        is always present, and the 2012 panel reads only `loading` and
        `items`, so it is unaffected.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: searchtext
          in: query
          required: true
          description: |
            Free-text workshop query. Required on stock -- without it no
            search is ever started and the response never settles. The mod
            reads a missing one as `""`, everything. Keep it short: a
            3000-character query failed Digest authentication.
          schema: { type: string }
          example: combat
        - name: p
          in: query
          required: false
          description: |
            1-based page number. Defaults to 1. **The engine ignores it**
            (measured): every page is the same first 50 hits.
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: |
            Either the loading sentinel, a page of results, or `{}` for an
            empty result. All three are `200 application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkshopSearchResult" }
              examples:
                loading:
                  summary: First call, and every call until the search settles
                  value: { loading: true }
                settled:
                  summary: A settled page (50 items)
                  externalValue: ../fixtures/getmods-settled.json
                emptyResult:
                  summary: No matches, or a search Steam failed -- no error either way
                  value: { items: [] }
                modSettled:
                  summary: With the mod, six hits
                  externalValue: ../fixtures/getmods-mod-settled.json
                modTimedOut:
                  summary: With the mod, a search with no answer after 30 s
                  value: { done: true, page: 1, items: [], count: 0,
                           error: "The workshop search had no answer after 30 s." }
          x-fixtures:
            - getmods-first.json
            - getmods-settled.json
            - getmods-mod-loading.json
            - getmods-mod-settled.json
            - getmods-mod-capped.json
            - getmods-mod-empty.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------- mod

  "/#request=runcommand":
    get:
      tags: [mod, server]
      operationId: runCommand
      x-request: runcommand
      x-requires-mod: true
      summary: Run a console command and return what it printed
      description: |
        **Mod only.** What `sendConsoleCommand` should have been.

        The mod wraps `ServerAdminPrint` (`core/lua/ServerAdmin.lua:156`) and
        `Shared.Message`, both plain writable globals that nobody aliases
        locally, and tees every line into a ring buffer.
        `Shared.ConsoleCommand` is synchronous, so by the time it returns the
        command's own output is already captured and can be returned with it.

        Reading the result:

        - `dispatched: true` means the command was created by
          `CreateServerAdminCommand` and ran -- proven by the audit line the
          game emits before every such command. `false` means either a plain
          console command such as `killall`, or no such command; **the server
          does not distinguish those two and neither should a client.**
        - `lines` is what it printed, in order, each tagged with where it came
          from: `audit` for the dispatch receipt, `admin` for
          `ServerAdminPrint`, `server` for `Shared.Message`.
        - **An empty `lines` with `dispatched: true` is normal and is not
          failure.** A successful `sv_kick` prints nothing at all -- only its
          failure branch calls `ServerAdminPrint`
          (`ServerAdminCommands.lua:172`) -- and `sv_cheats` reports nothing
          either way. Show "ran, no output", never "succeeded".

        Only the synchronous call is captured. Anything printed after it
        returns lands in the buffer and comes back through `getConsole`.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: cmd
          in: query
          required: true
          description: The command line, as typed at the server console.
          schema: { type: string }
          examples:
            kick: { value: "sv_kick 10000000" }
            slots: { value: "sv_reserved_slots 3" }
      responses:
        "200":
          description: The command ran. What it said, if anything, is in `lines`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
              examples:
                failed:
                  summary: A kick that matched nobody -- the case the stock API hides
                  value:
                    cmd: sv_kick NoSuchPlayer
                    dispatched: true
                    elapsed: 0
                    last_id: 17
                    lines:
                      - { id: 16, time: 1788642719, src: audit, text: "sv - Admin - 0: : STEAM_0:0:0: sv_kick" }
                      - { id: 17, time: 1788642719, src: admin, text: "No matching player" }
                unknown:
                  summary: No such command -- nothing is printed anywhere
                  value: { cmd: sv_nonsense, dispatched: false, elapsed: 0, lines: [], last_id: 17 }
          x-fixtures:
            - runcommand-failed.json
            - runcommand-unknown.json
            - runcommand-slots.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [mod, server]
      operationId: runCommandPost
      x-request: runcommand
      x-requires-mod: true
      summary: Run a console command (form body)
      description: Identical to the `GET` form. See `runCommand`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, cmd]
              properties:
                request: { const: runcommand }
                cmd: { type: string }
      responses:
        "200":
          description: The command ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getconsole":
    get:
      tags: [mod, server]
      operationId: getConsole
      x-request: getconsole
      x-requires-mod: true
      summary: Console output since a cursor
      description: |
        **Mod only.** The same capture that feeds `runCommand`, read as a
        stream: everything printed through `ServerAdminPrint` or
        `Shared.Message` since line `since`, whoever caused it. A command run
        from the game console, or by the 2012 panel through the legacy
        `command`/`rcon` path, appears here too.

        Poll with the `last_id` of the previous reply. `dropped` counts lines
        that fell out of the 500-entry ring before anyone read them, so a
        client can say "some output was missed" rather than silently skipping
        it.

        **Not persistent.** The buffer is Lua state and Lua state is rebuilt on
        every map change, so the stream restarts from nothing when the map
        changes. Durable history is the log tail's job, not this one.

        Engine chatter does not appear: an idle server produced zero lines over
        75 s, because the periodic messages in `log-Server.txt` are written
        engine-side and never pass through Lua.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: |
            Return lines with an id greater than this. Omit or `0` for
            everything the buffer still holds.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Console lines, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleStream" }
          x-fixtures:
            - getconsole.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getlog":
    get:
      tags: [mod, server]
      operationId: getLog
      x-request: getlog
      x-requires-mod: true
      summary: The engine's log, since a byte offset
      description: |
        **Mod only.** `log-Server.txt`, the engine's own log, read through
        `config://` -- which reaches it only when the engine writes it into the
        config directory: `-logdir` equal to `-config_path`, or neither flag
        (the default layout). Otherwise the reply says
        `source: none` and why, and the console buffer (`getConsole`) is what
        there is. See REQUIREMENTS.md item 7.

        It holds what never passes through Lua -- connects and auth, engine
        errors, `Script tracing`, Shine's chat and command lines -- and it
        **outlives a map change**, unlike the console buffer: the file is the
        engine's, not Lua state. It is served **verbatim**: IPs, Steam ids and
        chat included (by design, 2026-09-28).

        With no cursor, the last `tail_bytes` (64 KB), starting at a line.
        Poll with `since` = the previous `to` and `file` = the previous
        `file_id`; page back with `before` = the first line's `off`. Only
        complete lines are served: a line the engine has not finished is held
        until it has. A reply carries at most `max_bytes` (64 KB); `more`
        says to ask again at once. An idle poll reads nothing.

        `reset` replaces the cursor: `new_file` when the header's Date and
        Time differ from `file` (a restart moved the old log to
        `log-Server.old.txt`), `truncated` when the file is shorter than the
        cursor. The reply is then a fresh tail.

        The first `getLog` after each map load prints one line to the log,
        `webadmin-spa: checking that config://log-Server.txt is this server's
        log (<n>)`, and looks for it in the file: a copy an earlier run left
        in the config directory opens just as well and never grows. Then the
        reply is `source: none` with `stale: true`.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: Byte offset to read from, the previous reply's `to`.
          schema: { type: integer, minimum: 0 }
        - name: before
          in: query
          required: false
          description: |
            Byte offset to page back from, the first line's `off`. Up to
            `tail_bytes` before it, starting at a line. Ignored with `since`.
          schema: { type: integer, minimum: 0 }
        - name: file
          in: query
          required: false
          description: |
            The `file_id` the cursor belongs to. A different one is a
            `new_file` reset.
          schema: { type: string }
      responses:
        "200":
          description: Lines of the log, oldest first, or why there are none.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LogPage"
                  - $ref: "#/components/schemas/LogUnavailable"
          x-fixtures:
            - getlog-rig-tail.json
            - getlog-rig-since.json
            - getlog-rig-reset.json
            - getlog-rig-stale.json
            - getlog-none.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getperf":
    get:
      tags: [mod, performance]
      operationId: getPerf
      x-request: getperf
      x-requires-mod: true
      summary: Performance windows since a cursor
      description: |
        **Mod only.** What `perfmon` logs, served. The engine completes a
        `ServerPerformanceData` about once a second
        (`Shared.GetServerPerformanceData()`); the mod accumulates them into
        windows of `window_s` seconds (10) and keeps `capacity` of them (360,
        an hour). Each window adds the tickrate counted from `UpdateServer`
        calls and the longest single tick, because the engine's own tick
        interval is whole milliseconds (16 at tickrate 60, read as 62.5).
        Measured on the rig; see REQUIREMENTS.md item 10.

        Poll with the `last_id` of the previous reply. **Paged**: a reply
        holds at most 60 windows past `since`, and `engine` at most 60
        records past `esince` across its three lists, oldest first; `more`
        (and `engine.more`) is `true` while the server holds more past
        `last_id`, and a client asks again at once. An hour in one reply
        cost most of a tick at 80 to encode (SERVER-COST.md).

        **Not persistent**: the
        buffer is Lua state, rebuilt at every map change, so the ids restart
        from 1 and `loaded_at` moves. A client that sees `loaded_at` change
        knows a map change happened and that windows between its last poll and
        the change are gone.

        `engine` carries what the engine prints only to `log-Server.txt`:
        `tickstat` lines, snapshot rate steps, a bwlimit warning and the
        `perfmon:` block, found by a scan of the log every `scan_s` seconds
        and read with a cursor of their own (`esince`). Same lifetime as the
        windows. Measured on the rig's 09-27 engine; REQUIREMENTS.md item 10.

        Vanilla `getperfdata` is unchanged beside it, for the 2012 panel.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: |
            Return windows with an id greater than this, at most 60. Omit
            or `0` to start from the oldest the buffer still holds.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: esince
          in: query
          required: false
          description: |
            Return `engine` records with an id greater than this, at most
            60. Omit or `0` to start from the oldest held.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Windows, oldest first, and the rates the server runs at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfReport" }
              examples:
                rig:
                  externalValue: ../fixtures/getperf-rig.json
                populated:
                  externalValue: ../fixtures/getperf-rig-populated.json
                tickstat:
                  externalValue: ../fixtures/getperf-rig-tickstat.json
          x-fixtures:
            - getperf-rig.json
            - getperf-rig-since.json
            - getperf-rig-populated.json
            - getperf-rig-tickstat.json
            - getperf-rig-tickstat-off.json
            - getperf-rig-perfmon.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getbans":
    get:
      tags: [mod, players]
      operationId: getBans
      x-request: getbans
      x-requires-mod: true
      summary: The bans in force, from whichever table decides them
      description: |
        **Mod only.** Where `getbanlist` is `GetBannedPlayersList()` as it
        stands, this reads the table that actually decides who is banned:
        Shine's own when its ban plugin is on, which keeps who banned, when
        and for how long -- all of which `GetBannedPlayersList()` throws
        away -- and vanilla's otherwise.

        Normalized so a client need not know which it got: numeric ids,
        expired bans left out, a `permanent` flag in place of a sentinel
