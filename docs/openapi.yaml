openapi: 3.1.0

info:
  title: NS2 dedicated server web admin API
  version: "344+26-09-03"
  summary: The complete HTTP surface of the stock NS2 web admin, as implemented.
  description: |
    Machine-readable companion to [API.md](API.md). Both are read from
    `ns2/lua/ServerWebInterface.lua` (304 lines, UWE 2012, unchanged in build
    344 / 2026-09-03) and verified against a live server on 2026-09-05. Every
    schema here is checked against the committed captures in `fixtures/` by
    `tools/check-openapi.py`; nothing was guessed or crawled.

    ## One endpoint, not a REST API

    There are no paths, no REST verbs and no status-code vocabulary. Every
    call is a `GET` or `POST` to `/`, and the action is chosen by the
    `request` query parameter. The Lua handler is `OnWebRequest(actions)` --
    it receives the query parameters of a `GET`, or the form body of a
    `POST` (whose query string is dropped; measured on 09-26), and **never
    learns the path, the method or any header**, so on a stock server `/`,
    `/does-not-exist.png` and `/?request=json` all get the same answer. With
    the mod, a request with no parameters at all gets a page leading to the
    panel instead (`/#no-parameters`).

    OpenAPI keys operations by path, which this API does not vary, so each
    action below is keyed by a URL fragment naming its `request` value:

        /#request=getbanlist   ->   GET /?request=getbanlist

    The fragment is documentation, not part of the wire format. The real path
    is always `/`, and each operation pins its action with a `const` on the
    `request` parameter. `x-request` on each operation carries the same value
    for tooling.

    ## Consequences worth knowing before writing a client

    - **There is no 404.** Any path that is not a file under the web root
      falls through to the default handler and returns `200 application/json`
      with the full server-state blob -- names, SteamIDs and IP addresses
      included. A typo in a script path yields a JSON parse error, never a
      missing-file error. Never use the status code to detect a missing asset.
    - **There is no directory index.** The panel is at `/index.html`; a bare
      `/` is the server-state blob.
    - **Method is not enforced.** Every write also works as a `GET` with
      query parameters, which is how the shipped panel installs mods
      (`modbrowser.js:25`). Only `GET` and `POST` reach Lua at all; `PUT` and
      `DELETE` are refused `405` by the 26-09-03 web server.
    - **Writes return an empty `200`** whose `Content-Type` is `text/html`,
      not JSON. There is no success flag and no error body.
    - **Console commands return nothing.** `sv_kick` against a bogus name and
      against a real SteamID produce byte-comparable responses; the failure
      reaches `log-Server.txt` only. This is the single largest gap for a
      modern panel -- see [CONSTRAINTS.md](CONSTRAINTS.md).
    - **Types are inconsistent.** On a stock server `cheats`, `devmode` and
      `isbot` are stringified booleans; `iscomm` and `game_started` are real
      ones. The mod sends all five as real booleans. `steamid`
      is a number in server state and in the ban list, but mod ids are hex
      **strings** everywhere. Do not assume; do not parse mod ids as numbers.
    - **Player rows carry full IP addresses** over plain HTTP. Mask by
      default. Never commit a live capture.

servers:
  - url: http://{host}:{port}
    description: A dedicated server started with -webadmin
    variables:
      host:
        default: 127.0.0.1
        description: The -webdomain value, or the server's address.
      port:
        default: "8080"
        description: The -webport value.

security:
  - digestAuth: []

tags:
  - name: server
    description: Server state and console commands.
  - name: players
    description: Bans and reserved slots.
  - name: chat
    description: The in-game chat ring buffer.
  - name: performance
    description: Tickrate and entity-count samples.
  - name: maps
    description: Map list and map cycle.
  - name: mods
    description: Installed mods and workshop search.
  - name: static
    description: The panel's own files, served from the web root.
  - name: mod
    description: |
      Added by the webadmin-spa mod's `lua/ServerWebInterface.lua`. **Absent on
      a stock server**, where these `request` values are unrecognised and fall
      through to the server-state blob like any other unknown value -- so a
      client cannot tell a mod request type from a typo by status code. Detect
      the mod with `mod_version` in the state blob instead.

paths:

  # ---------------------------------------------------------------- server

  "/#no-parameters":
    get:
      tags: [server, mod]
      operationId: getRoot
      summary: A request with no parameters at all
      description: |
        `/`, a path that is not a file (`/index.htm`, `/missing.png`), `/?`,
        `/?foo` (a key with no `=` does not reach Lua) and a `POST` with an
        empty body: the Lua sees an empty parameter table for all of them.

        **Stock:** the server-state blob, as `getServerState`, so the address
        the boot log prints hands every player's name, Steam id and IP to
        whoever opens it (CURRENT-UI defect 12).

        **With the mod** *(2026-10-06, CONSTRAINTS item 6)*: a page holding no
        server data, whose meta refresh leads a browser to `/index.html`. A
        script asking for state sends `request=json`, as both panels do; a
        parameter with any value, even empty (`?foo=`), is not this case.
        The engine passes Lua no headers, so `Accept` cannot choose between
        the two; and Lua returns only a type and a body, so this cannot be
        an HTTP redirect.
      responses:
        "200":
          description: The page with the mod; the state blob without.
          content:
            text/html:
              schema: { type: string }
              examples:
                mod:
                  summary: Measured on the rig, 09-27 engine
                  externalValue: ../fixtures/root-mod.html
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=json":
    get:
      tags: [server]
      operationId: getServerState
      x-request: json
      summary: Full server state (the default response)
      description: |
        `GetServerState()`, `ServerWebInterface.lua:78-135`. This is the
        **fallthrough**: any `request` value that is not one of the eleven
        recognised actions lands here, as does a request with no `request` at
        all. The shipped panel sends the literal `request=json`
        (`rcon.js:21`), which is simply one of the unmatched values. With the
        mod, a request with no parameters at all is the one exception: see
        `getRoot`.

        Passing `command` **and** `rcon` runs a console command before the
        state is built; see `sendConsoleCommand`.
      parameters:
        - $ref: "#/components/parameters/RequestJson"
      responses:
        "200":
          description: |
            Server state. Rendered from live entities, so `uptime`,
            `frame_rate` and `game_time` drift between any two samples.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
              examples:
                empty:
                  summary: Idle server, no players
                  externalValue: ../fixtures/serverstate.json
                populated:
                  summary: 12 players, game in progress
                  externalValue: ../fixtures/serverstate-populated.json
          x-fixtures:
            - serverstate.json
            - serverstate-populated.json
            - serverstate-rcon.json
            - serverstate-after-kick.json
            - serverstate-after-real-kick.json
            - serverstate-after-mapchange.json
            - serverstate-shine.json
            - serverstate-mod.json
            - serverstate-shine-basecommands.json
            - serverstate-shine-populated.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#command=Send":
    get:
      tags: [server]
      operationId: sendConsoleCommand
      x-request: json
      summary: Run a server console command (no output is returned)
      description: |
        `ServerWebInterface.lua:278-280`:

            if actions.command then
                Shared.ConsoleCommand(actions.rcon)
            end

        **Both parameters are required.** `command` is only tested for
        truthiness -- the shipped panel sends the literal `command=Send`
        (`rcon.js:293`) -- while the command text is read from `rcon`.
        Sending `rcon` alone does nothing.

        **Nothing is returned.** The response is the ordinary server-state
        blob, with no success flag and no output. Verified on a live server:
        `sv_kick <bot name>` (which failed with `No matching player`) and
        `sv_kick <real steamid>` (which disconnected the player) returned the
        same status, the same `Content-Type` and the same key set, differing
        only in fields that drift between any two samples. The successful kick
        still reported `players_online: 12`, because the response is built
        before the disconnect completes -- so the outcome cannot be inferred
        by diffing against the previous poll either. `rcon.js:290` fires the
        request, ignores the response and refreshes 500 ms later; nothing else
        is available to it.

        This operation is the same fallthrough as `getServerState`; it is
        listed separately because it is the whole write surface for kicks,
        bans, map changes, chat and reserved slots.
      parameters:
        - $ref: "#/components/parameters/RequestJson"
        - name: command
          in: query
          required: true
          description: |
            Any truthy value. The panel sends `Send`. Its content is never read.
          schema: { type: string, default: Send }
          example: Send
        - name: rcon
          in: query
          required: true
          description: |
            The console command line, as typed at the server console.
            Commands the shipped panel issues: `sv_kick`, `sv_ban`, `sv_unban`,
            `sv_changemap`, `sv_say`, `sv_tsay <team>`, `sv_psay`, `sv_slay`,
            `sv_eject`, `sv_switchteam`, `sv_reserved_slots`,
            `sv_add_reserved_slot`, `sv_remove_reserved_slot`, `sv_password`,
            `sv_cheats`.
          schema: { type: string }
          examples:
            kick: { value: "sv_kick 10000000" }
            ban: { value: "sv_ban 10000000 30 Griefing" }
            changemap: { value: "sv_changemap ns2_veil" }
            say: { value: "sv_say Server restarting in 5 minutes" }
      responses:
        "200":
          description: |
            Server state, identical in shape to `getServerState`. It reflects
            neither the success nor the failure of the command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
          x-fixtures:
            - rcon-kick.json
            - rcon-kick-success.json
            - rcon-say.json
            - rcon-changemap.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # --------------------------------------------------------------- players

  "/#request=getbanlist":
    get:
      tags: [players]
      operationId: getBanList
      x-request: getbanlist
      summary: List banned players
      description: |
        `GetBannedPlayersList()`, `ServerAdminCommands.lua:494`. Bans are
        added and removed through the console (`sv_ban`, `sv_unban`); there is
        no request type for either.

        **Expired bans are never pruned from this list** -- a ban whose `time`
        has passed keeps being reported even though it no longer blocks
        anyone. A client that wants a truthful list must filter on
        `time == 0 or time > now` itself.

        **On a server running Shine's ban plugin the list is Shine's, not
        vanilla's.** The plugin replaces `GetBannedPlayersList()` a second
        after load with one built from its own table: `id` becomes a digit
        string, the order is `pairs()` order and is not stable, and `time`
        is Shine's `UnbanTime`, which can be a float far beyond any real
        date for an effectively permanent ban (`6e+24` seen on a real
        Shine server, 2026-09-27). Shine also redirects `sv_ban`/`sv_unban` to
        its own commands and rejects banned players in its own connection
        hook. A client must sort the list itself and accept both id types.
        The Shine fixture is synthetic, in the measured shape: the only real
        capture is a production list.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The ban list, empty array when nobody is banned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BanRecord" }
              examples:
                empty: { value: [] }
                populated:
                  externalValue: ../fixtures/getbanlist-populated.json
          x-fixtures:
            - getbanlist.json
            - getbanlist-populated.json
            - getbanlist-shine.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getreservedslots":
    get:
      tags: [players]
      operationId: getReservedSlots
      x-request: getreservedslots
      summary: Reserved slot count and the ids that hold them
      description: |
        `GetReservedSlotData()`, `ServerAdminCommands.lua:595`. Returns `{}`
        with neither key when the server has no reserved-slot config.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Reserved slot configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservedSlots" }
              examples:
                empty:
                  externalValue: ../fixtures/getreservedslots.json
          x-fixtures:
            - getreservedslots.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=setreservedslotamount":
    get:
      tags: [players]
      operationId: setReservedSlotAmount
      x-request: setreservedslotamount
      x-broken: true
      deprecated: true
      summary: Set the reserved slot count -- BROKEN, does nothing
      description: |
        **This request type has never worked.** `ServerWebInterface.lua:209`
        calls `SetReservedSlotAmount(actions.amount)`, but the function is
        declared `SetReservedSlotAmount(client, amount)`
        (`ServerAdminCommands.lua:614`). The amount arrives as `client`,
        `amount` is `nil`, `tonumber(nil)` is `nil`, and the guard on line 618
        rejects the call. The request answers `200` with an empty body and
        changes nothing.

        Verified both ways on a live server: the API call left `amount` at `0`
        and logged nothing, while `sv_reserved_slots 3` through the console
        path set it to `3` and logged `Reserved slot amount set to 3`.

        The fix is one line -- `SetReservedSlotAmount(nil, actions.amount)` --
        and the mod ships it. Against a stock server, drive reserved slots
        through `sv_reserved_slots`, `sv_add_reserved_slot` and
        `sv_remove_reserved_slot` via `sendConsoleCommand` instead.

        Marked `deprecated` here to keep generated clients away from it; the
        request type is current, merely non-functional.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: amount
          in: query
          required: true
          description: |
            Slot count, `0 <= amount <= Server.GetMaxPlayers()`. Ignored by the
            stock build; honoured by the mod's corrected Lua.
          schema: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/EmptyWrite" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [players]
      operationId: setReservedSlotAmountPost
      x-request: setreservedslotamount
      deprecated: true
      summary: Set the reserved slot count -- BROKEN, does nothing (form body)
      description: |
        Identical to the `GET` form, but every parameter, `request` included,
        must be in the form body: a `POST`'s query string never reaches Lua
        (measured on 09-26). Just as broken. See `setReservedSlotAmount`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, amount]
              properties:
                request: { const: setreservedslotamount }
                amount: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/EmptyWrite" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ chat

  "/#request=getchatlist":
    get:
      tags: [chat]
      operationId: getChatList
      x-request: getchatlist
      summary: The last 20 chat messages
      description: |
        `ServerWebInterface.lua:176`:

            Server.recentChatMessages and json.encode(...) or "{ }"

        A ring buffer of **20** entries (`Server.lua:74`), each with a
        monotonically increasing `id` a client can use to detect new messages
        and gaps. When the buffer does not exist the reply is the literal
        `{ }` -- an **object**, where every other reply is an array. Handle
        both shapes.

        This list is also the shipped panel's "console": since console commands
        return no output, chat is the only server-side text a client can read.

        **With the mod and `since`** *(2026-10-06)*: a `ChatStream` instead,
        from the mod's own ring of 200, which records every call to
        `Server.AddChatToHistory` -- player chat, `sv_say`, `sv_tsay` and
        Shine's `sh_say` -- with a time. Poll with the previous reply's
        `last_id`, as with `getconsole`. Ids restart from 1 at every map
        change (both rings are Lua state), so a `last_id` below the cursor
        means the map changed. Without `since` the mod answers exactly as
        stock does, because the 2012 panel polls that shape.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: |
            **Mod only.** Return the mod's entries with an id greater than
            this; `0` for everything its ring still holds. Ignored by a stock
            server, and by the mod when it is not a number.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Chat entries, oldest first.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
                  - type: object
                    description: The `{ }` sent when the ring buffer is absent.
                    additionalProperties: false
                  - $ref: "#/components/schemas/ChatStream"
              examples:
                empty: { value: [] }
                populated:
                  externalValue: ../fixtures/getchatlist-player.json
                noBuffer:
                  summary: No ring buffer
                  value: {}
          x-fixtures:
            - getchatlist.json
            - getchatlist-before.json
            - getchatlist-after.json
            - getchatlist-player.json
            - getchatlist-mod.json
            - getchatlist-mod-since.json
            - getchatlist-mod-restarted.json
            - getchatlist-mod-player.json
            - getchatlist-player-rig.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ----------------------------------------------------------- performance

  "/#request=getperfdata":
    get:
      tags: [performance]
      operationId: getPerfData
      x-request: getperfdata
      summary: Up to 30 performance samples
      description: |
        `perfDataBuffer:ToTable()`, `ServerWebInterface.lua:174`. A ring buffer
        of **30** samples taken **once every 60 s** (`kMaxPerfDatas = 30`,
        `kLogPerfDataRate = 60`), so the window is a half hour and polling
        faster than once a minute returns the same data.
        The mod leaves it as it is; its `getperf` serves far more.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Samples, oldest first, at most 30.
          content:
            application/json:
              schema:
                type: array
                maxItems: 30
                items: { $ref: "#/components/schemas/PerfSample" }
              examples:
                populated:
                  externalValue: ../fixtures/getperfdata-populated.json
          x-fixtures:
            - getperfdata.json
            - getperfdata-populated.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ maps

  "/#request=getmaplist":
    get:
      tags: [maps]
      operationId: getMapList
      x-request: getmaplist
      summary: Maps installed on the server
      description: |
        `GetMapList()`, `ServerWebInterface.lua:44`. Every map the server can
        load, with the workshop mod that provides it -- `"0"` for a stock map.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Installed maps.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MapListEntry" }
              examples:
                stock:
                  externalValue: ../fixtures/getmaplist.json
                modded:
                  externalValue: ../fixtures/getmaplist-modded.json
          x-fixtures:
            - getmaplist.json
            - getmaplist-modded.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmapcycle":
    get:
      tags: [maps]
      operationId: getMapCycle
      x-request: getmapcycle
      summary: The current map cycle
      description: |
        Stock: `MapCycle_GetMapCycle()` with `ModsIdsToHex` applied to the
        cycle and to every map entry, `ServerWebInterface.lua:181-190`. That
        is the copy loaded with the map, not the file rotation reads, so a
        hand edit of `MapCycle.json` does not show here until the next map --
        and the copy is shallow, so the read rewrites the live cycle's mod
        ids to hex (CONSTRAINTS items 12 and 13).

        **With the mod** it reads `config://MapCycle.json` itself, falling
        back to the in-memory copy only when the file is missing or does not
        parse, and never mutates the live cycle. Same shape either way.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The map cycle, mod ids hex-encoded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapCycle" }
              examples:
                stock:
                  externalValue: ../fixtures/getmapcycle.json
                modded:
                  externalValue: ../fixtures/getmapcycle-modded.json
                shine-options:
                  externalValue: ../fixtures/getmapcycle-shine-options.json
          x-fixtures:
            - getmapcycle.json
            - getmapcycle-before.json
            - getmapcycle-after.json
            - getmapcycle-modded.json
            - getmapcycle-shine-options.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=setmapcycle":
    post:
      tags: [maps]
      operationId: setMapCycle
      x-request: setmapcycle
      summary: Replace the map cycle
      description: |
        `ServerWebInterface.lua:191-205`. The cycle arrives as a **JSON string
        in the `data` parameter** -- not as a JSON request body -- is decoded,
        has `ModIdsFromHex` applied to it and to every map entry, and is
        written to `config://MapCycle.json` by `MapCycle_SetMapCycle`.

        Whole-document write: there is no way to add or remove a single map.
        Read the cycle, modify it, send it back.

        Bad JSON logs `setmapcycle web request passed bad json data` and
        returns without writing -- and, because the handler returns `nil`
        rather than `""`, that failure looks exactly like success from the
        client's side. So does a cycle with no `maps` (a Lua error before the
        write), and a junk mod id is logged and then written anyway
        (measured, CONSTRAINTS item 13).

        **With the mod** the write is checked first -- `maps` a non-empty
        list of names or `{map}` objects, `time` a number >= 0, `mode`
        `order` or `random`, every mod id hex or carrying `:` -- and refused
        with a reason and nothing written. An accepted cycle is written, the
        file read back, and returned. Keys the check does not know (Shine's
        per-map `min`, `max`, `chance`, top-level `groups`) pass through.

        A stock 17-map cycle serialises to **263 bytes**, 249x under the 64 KB
        request-body cap; the cap is not a practical constraint. Verified to
        round-trip losslessly.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, data]
              properties:
                request: { const: setmapcycle }
                data:
                  type: string
                  description: |
                    A `MapCycle` serialised with `JSON.stringify`. Mod ids must
                    be hex strings, as `getmapcycle` returns them.
                  contentMediaType: application/json
                  contentSchema: { $ref: "#/components/schemas/MapCycle" }
            example:
              request: setmapcycle
              data: '{"time":30,"mode":"order","maps":["ns2_summit","ns2_veil"],"mods":["1e62a2ce"]}'
      responses:
        "200":
          description: |
            Stock: an empty `text/html` body whatever happened (see
            `EmptyWrite`). With the mod: JSON, `ok` and either the cycle as
            the file now holds it or the reason it was refused.
          content:
            text/html:
              schema: { type: string, const: "" }
            application/json:
              schema: { $ref: "#/components/schemas/MapCycleWrite" }
              examples:
                written:
                  externalValue: ../fixtures/setmapcycle-ok.json
                refused:
