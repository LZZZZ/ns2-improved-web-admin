            `getinstalledmodslist` report it. `1e62a2ce` is workshop item
            `509780686`.
          schema: { $ref: "#/components/schemas/ModId" }
          example: 1e62a2ce
      responses:
        "200":
          description: |
            Stock: an empty `text/html` body whatever happened (see
            `EmptyWrite`). With the mod: JSON, `ok` and what was done, or why
            the id was refused.
          content:
            text/html:
              schema: { type: string, const: "" }
            application/json:
              schema: { $ref: "#/components/schemas/InstallModResult" }
              examples:
                alreadyInstalled:
                  externalValue: ../fixtures/installmod-already.json
                refused:
                  externalValue: ../fixtures/installmod-refused.json
          x-fixtures:
            - installmod-already.json
            - installmod-refused.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [mods]
      operationId: installModPost
      x-request: installmod
      summary: Download a workshop mod (form body)
      description: Identical to the `GET` form. See `installMod`. The panel posts.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, modid]
              properties:
                request: { const: installmod }
                modid: { $ref: "#/components/schemas/ModId" }
      responses:
