openapi: 3.1.0

info:
  title: NS2 dedicated server web admin API
  version: "344+26-10-15"
  summary: The HTTP surface of the server web admin, as `ServerWebInterface.lua` implements it.
  description: |
    Machine-readable companion to [API.md](API.md). Read from
    `lua/ServerWebInterface.lua` and measured against a server on the beta
    engine (10-12 or later, which the Lua needs). Every schema here is checked
    against the committed captures in `fixtures/` by `tools/check-openapi.py`.

    ## One endpoint, not a REST API

    There are no REST paths, verbs or status codes. Every call is a `GET` or
    `POST` to `/`, and the action is chosen by the `request` parameter. The
    Lua handler is `OnWebRequest(actions, request)`: `actions` is the query
    string of a `GET`, or the form body of a `POST` (whose query string is
    dropped; measured on 09-26), and `request` the path, method and headers.

    OpenAPI keys operations by path, which this API does not vary, so each
    action below is keyed by a URL fragment naming its `request` value:

        /#request=getbans   ->   GET /?request=getbans

    The fragment is documentation, not part of the wire format. The real path
    is always `/`, and each operation pins its action with a `const` on the
    `request` parameter. `x-request` on each operation carries the same value
    for tooling.

    ## Consequences worth knowing before writing a client

    - **There is no 404.** A path that is not a file under the web root gets
      the panel (`/#no-parameters`), and an unknown `request` value gets the
      server-state blob, both with `200`. Never use the status code to detect
      a missing asset or a typo.
    - **Method is not enforced.** Every write also works as a `GET` with query
      parameters. Only `GET` and `POST` reach Lua at all; `PUT` and `DELETE`
      are refused `405` by the engine's web server.
    - **Reads and writes answer JSON**, a write saying what it did or why it
      refused. `runcommand` returns what a console command printed.
    - **Steam ids are numbers, mod ids hex strings.** `steamid` is a number in
      server state and in the ban list, but mod ids are hex **strings**
      everywhere. Do not parse mod ids as numbers.
    - **Player rows carry full IP addresses** over plain HTTP. Mask by
      default. Never commit a live capture.

servers:
  - url: http://{host}:{port}
    description: A dedicated server started with -webadmin
    variables:
      host:
        default: 127.0.0.1
        description: The -webdomain value, or the server's address.
      port:
        default: "8080"
        description: The -webport value.

security:
  - digestAuth: []

tags:
  - name: server
    description: Server state and console commands.
  - name: players
    description: Bans and reserved slots.
  - name: chat
    description: The in-game chat ring buffer.
  - name: performance
    description: Performance windows and the engine's own reports.
  - name: maps
    description: Map list and map cycle.
  - name: mods
    description: Installed mods and workshop search.
  - name: static
    description: The panel's own files, served from the web root.

paths:

  # ---------------------------------------------------------------- server

  "/#no-parameters":
    get:
      tags: [server]
      operationId: getRoot
      summary: A request with no parameters at all
      description: |
        `/`, a path that is not a file (`/index.htm`, `/missing.png`), `/?`,
        `/?foo` (a key with no `=` does not reach Lua) and a `POST` with an
        empty body: the Lua sees an empty parameter table for all of them.
        Since the 10-12 engine its hook also gets the request's `path`,
        `method` and `headers` (names in lower case, never `authorization`
        or `cookie`; measured 2026-10-12).

        At `/`, a browser (`Accept` naming `text/html`) gets the panel
        itself, the Lua reading `web/index.html` (or, if it cannot, a page
        whose meta refresh leads to `/index.html`); anything else gets the
        state blob, which auto-shutdown scripts read. Any other path gets the
        panel too (CONSTRAINTS item 6). A parameter with any value, even
        empty (`?foo=`), is not this case. Lua returns only a type and
        a body, so this cannot be an HTTP redirect or a `404`.
      responses:
        "200":
          description: >
            The panel for a browser at `/` and for any other path, the state
            blob for a script at `/`.
          content:
            text/html:
              schema: { type: string }
              examples:
                fallback:
                  summary: A browser at `/` when web/index.html cannot be read
                  externalValue: ../fixtures/root-fallback.html
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=json":
    get:
      tags: [server]
      operationId: getServerState
      x-request: json
      summary: Full server state (the default response)
      description: |
        `GetServerState()`. This is the **fallthrough**: any `request` value
        that is not one of the fourteen below lands here, as does a request
        with parameters but no `request`. The panel sends `request=json`,
        which is one of the unmatched values. A request with no parameters at
        all is the one exception: see `getRoot`.
      parameters:
        - $ref: "#/components/parameters/RequestJson"
      responses:
        "200":
          description: |
            Server state. Rendered from live entities, so `uptime`,
            `frame_rate` and `game_time` drift between any two samples.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
              examples:
                empty:
                  summary: No players
                  externalValue: ../fixtures/serverstate.json
                populated:
                  summary: Players, game in progress, Shine loaded
                  externalValue: ../fixtures/serverstate-shine-populated.json
          x-fixtures:
            - serverstate.json
            - serverstate-shine-populated.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # --------------------------------------------------------------- players

  "/#request=getreservedslots":
    get:
      tags: [players]
      operationId: getReservedSlots
      x-request: getreservedslots
      summary: Reserved slot count and the ids that hold them
      description: |
        `GetReservedSlotData()`, `ServerAdminCommands.lua:595`. Returns `{}`
        with neither key when the server has no reserved-slot config.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Reserved slot configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservedSlots" }
              examples:
                empty:
                  externalValue: ../fixtures/getreservedslots.json
          x-fixtures:
            - getreservedslots.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ chat

  "/#request=getchatlist":
    get:
      tags: [chat]
      operationId: getChatList
      x-request: getchatlist
      summary: The chat, since a cursor
      description: |
        The chat ring, `Server.recentChatMessages`: **200** entries
        (`Server.lua`), each with its time. It holds every call to
        `Server.AddChatToHistory` -- player chat, `sv_say`, `sv_tsay` and
        Shine's `sh_say`.

        Poll with the previous reply's `last_id`. Ids restart from 1 at every
        map change (the ring is Lua state), so a `last_id` below the cursor
        means the map changed.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: |
            Return entries with an id greater than this. Omitted, or not a
            number, reads as `0`: everything the ring still holds.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Chat entries, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatStream" }
              examples:
                player:
                  externalValue: ../fixtures/getchatlist-player.json
          x-fixtures:
            - getchatlist.json
            - getchatlist-since.json
            - getchatlist-restarted.json
            - getchatlist-player.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ maps

  "/#request=getmaplist":
    get:
      tags: [maps]
      operationId: getMapList
      x-request: getmaplist
      summary: Maps installed on the server
      description: |
        `GetMapList()`. Every map the server can load, with the workshop mod
        that provides it -- `"0"` for a stock map.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Installed maps.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MapListEntry" }
              examples:
                stockMaps:
                  externalValue: ../fixtures/getmaplist.json
                modded:
                  externalValue: ../fixtures/getmaplist-modded.json
          x-fixtures:
            - getmaplist.json
            - getmaplist-modded.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmapcycle":
    get:
      tags: [maps]
      operationId: getMapCycle
      x-request: getmapcycle
      summary: The current map cycle
      description: |
        `config://MapCycle.json`, the file rotation reads, with mod ids
        hex-encoded. The copy the game loaded with the map is used only when
        the file is missing or does not parse, and is never mutated
        (CONSTRAINTS items 12 and 13).
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The map cycle, mod ids hex-encoded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapCycle" }
              examples:
                stockMaps:
                  externalValue: ../fixtures/getmapcycle.json
                modded:
                  externalValue: ../fixtures/getmapcycle-modded.json
                shine-options:
                  externalValue: ../fixtures/getmapcycle-shine-options.json
          x-fixtures:
            - getmapcycle.json
            - getmapcycle-before.json
            - getmapcycle-after.json
            - getmapcycle-modded.json
            - getmapcycle-shine-options.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=setmapcycle":
    post:
      tags: [maps]
      operationId: setMapCycle
      x-request: setmapcycle
      summary: Replace the map cycle
      description: |
        The cycle arrives as a **JSON string in the `data` parameter** --
        not as a JSON request body. Whole-document write: there is no way to
        add or remove a single map. Read the cycle, modify it, send it back.

        It is checked first -- `maps` a non-empty list of names or `{map}`
        objects, `time` a number >= 0, `mode` `order` or `random`, every mod
        id hex or carrying `:` -- and refused with a reason and nothing
        written. An accepted cycle has `ModIdsFromHex` applied to it and to
        every map entry, is written by `MapCycle_SetMapCycle`, and the file is
        read back and returned. Keys the check does not know (Shine's per-map
        `min`, `max`, `chance`, top-level `groups`) pass through.

        A 17-map cycle serialises to **263 bytes**, 249x under the 64 KB
        request-body cap; the cap is not a practical constraint. Verified to
        round-trip losslessly.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, data]
              properties:
                request: { const: setmapcycle }
                data:
                  type: string
                  description: |
                    A `MapCycle` serialised with `JSON.stringify`. Mod ids must
                    be hex strings, as `getmapcycle` returns them.
                  contentMediaType: application/json
                  contentSchema: { $ref: "#/components/schemas/MapCycle" }
            example:
              request: setmapcycle
              data: '{"time":30,"mode":"order","maps":["ns2_summit","ns2_veil"],"mods":["1e62a2ce"]}'
      responses:
        "200":
          description: |
            `ok` and either the cycle as the file now holds it or the reason
            it was refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapCycleWrite" }
              examples:
                written:
                  externalValue: ../fixtures/setmapcycle-ok.json
                refused:
                  externalValue: ../fixtures/setmapcycle-refused.json
          x-fixtures:
            - setmapcycle-ok.json
            - setmapcycle-refused.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ mods

  "/#request=getinstalledmodslist":
    get:
      tags: [mods]
      operationId: getInstalledModsList
      x-request: getinstalledmodslist
      summary: Mods downloaded to the server (not necessarily loaded)
      description: |
        `GetModList()`. **Installed is not loaded.** A mod appears here within seconds of `installmod`, but it is
        only mounted when it is in the map cycle's `mods` array *and* the map
        changes -- verified: setting `mods: ["1e62a2ce"]` and running
        `sv_changemap` produced `Mounting mod 'Combat Fix'[509780686]`.

        **There is no uninstall.** Nothing in the API removes a downloaded
        mod, so this list only ever grows.

        Each row says whether it is mounted now (`active`) and the engine's
        whitelist verdict (`whitelisted`). See the schema.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Installed mods.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstalledMod" }
              examples:
                installed:
                  externalValue: ../fixtures/getinstalledmodslist.json
          x-fixtures:
            - getinstalledmodslist.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=installmod":
    get:
      tags: [mods]
      operationId: installMod
      x-request: installmod
      summary: Download a workshop mod
      description: |
        `Server.InstallMod`. Asynchronous. The engine call returns nothing,
        and drops an id it cannot parse without a word (`-5` became mod
        18446744073709551611 -- measured on 09-26), so a malformed id is
        refused before the call, and an accepted one says whether it was
        installed already.

        The only proof of a download is `getinstalledmodslist`: a
        mod is listed once it is downloaded and unpacked, under its real
        title, and never before (1.7 s for a 710-byte mod, 3.8 s for 26 MB on
        the rig). An id Steam does not have never arrives. Re-installing an
        installed mod checks it and downloads nothing when it is current.

        **Loading a non-whitelisted mod silently unranks the server** -- the
        log says `Ranking disabled: server has non-whitelisted mods mounted`
        and `Requesting server ranking be enabled, request success: false`.
        Removing the mod restores ranking. `whitelisted` on each search hit
        and installed mod says so beforehand, `ranking_active` afterwards.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: modid
          in: query
          required: true
          description: |
            Workshop id as a **hex string**, as `getmods` and
            `getinstalledmodslist` report it. `1e62a2ce` is workshop item
            `509780686`.
          schema: { $ref: "#/components/schemas/ModId" }
          example: 1e62a2ce
      responses:
        "200":
          description: "`ok` and what was done, or why the id was refused."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallModResult" }
              examples:
                alreadyInstalled:
                  externalValue: ../fixtures/installmod-already.json
                refused:
                  externalValue: ../fixtures/installmod-refused.json
          x-fixtures:
            - installmod-already.json
            - installmod-refused.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [mods]
      operationId: installModPost
      x-request: installmod
      summary: Download a workshop mod (form body)
      description: Identical to the `GET` form. See `installMod`. The panel posts.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, modid]
              properties:
                request: { const: installmod }
                modid: { $ref: "#/components/schemas/ModId" }
      responses:
        "200":
          description: As for the `GET` form.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallModResult" }
              examples:
                installed:
                  externalValue: ../fixtures/installmod-ok.json
          x-fixtures:
            - installmod-ok.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmods":
    get:
      tags: [mods]
      operationId: getMods
      x-request: getmods
      summary: Search the Steam workshop (asynchronous, poll until settled)
      description: |
        The Lua handler cannot block, so the first call **starts**
        `Server.SearchWorshop` (the spelling is UWE's) and returns `loading`
        immediately. Poll the same URL until the reply is something else.

        What the engine does, measured on 09-26 (REQUIREMENTS item 4):

        - **At most 50 hits, and no paging.** Pages 1, 2, 3 and 500 of one
          search were the same 50 items, so only page 1 is asked for. The
          engine logs the total (`numMatching = 2874`) but does not hand it
          to Lua.
        - Relevance order: `combat fix` puts Combat Fix first.
        - The callback gets one table. An empty one means no matches **or a
          search Steam failed** (`Failed Steam error NoConnection` with the
          rig offline, answered at once); nothing tells the two apart.
        - A search answers in 0.3-0.9 s.

        A settled result is cached for **60 s** by its text. A search with no
        answer after **30 s** is reported once, with `error`; the next request
        starts a fresh one (CONSTRAINTS item 2).
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: searchtext
          in: query
          required: false
          description: |
            Free-text workshop query; missing reads as `""`, everything. Keep
            it short: a 3000-character query failed Digest authentication.
          schema: { type: string, default: "" }
          example: combat
      responses:
        "200":
          description: Either still loading, or settled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkshopSearchResult" }
              examples:
                loading:
                  summary: Every call until the search settles
                  externalValue: ../fixtures/getmods-loading.json
                settled:
                  summary: Six hits
                  externalValue: ../fixtures/getmods-settled.json
                empty:
                  summary: No matches, or a search Steam failed -- no error either way
                  externalValue: ../fixtures/getmods-empty.json
                timedOut:
                  summary: A search with no answer after 30 s
                  value: { items: [], error: "The workshop search had no answer after 30 s." }
          x-fixtures:
            - getmods-loading.json
            - getmods-settled.json
            - getmods-capped.json
            - getmods-empty.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # --------------------------------------------------------------- console

  "/#request=runcommand":
    get:
      tags: [server]
      operationId: runCommand
      x-request: runcommand
      summary: Run a console command and return what it printed
      description: |
        Runs it with `Shared.CaptureConsoleCommand` (10-12 engine), which
        returns everything the command printed: script lines, engine
        lines (`tickstat`, `bwlimit`, `perfmon`) and Shine's. The lines reach
        the log as well. Shine's `ServerAdminPrint` prints nothing without a
        client, so the Lua puts the nil-client branch back over it, and a
        vanilla `sv_` command's output comes back under Shine too.

        Reading the result:

        - `dispatched: true` means the command was created by
          `CreateServerAdminCommand` and ran -- proven by the audit line the
          game emits before every such command. `false` means either a plain
          console command such as `killall`, or no such command; **the server
          does not distinguish those two and neither should a client.**
        - `lines` is what it printed, in order, numbered from 1: `audit` for
          the dispatch receipt, `server` for everything else. The log's
          `[hh:mm:ss]` before a script's line is dropped.
        - **An empty `lines` with `dispatched: true` is normal and is not
          failure.** A successful `sv_kick` prints nothing at all -- only its
          failure branch calls `ServerAdminPrint`
          (`ServerAdminCommands.lua:172`) -- and `sv_cheats` reports nothing
          either way. Show "ran, no output", never "succeeded".

        Only the synchronous call is captured. Anything printed after it
        returns is in the log (`getLog`).
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: cmd
          in: query
          required: true
          description: The command line, as typed at the server console.
          schema: { type: string }
          examples:
            kick: { value: "sv_kick 10000000" }
            slots: { value: "sv_reserved_slots 3" }
      responses:
        "200":
          description: The command ran. What it said, if anything, is in `lines`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
              examples:
                failed:
                  summary: A kick that matched nobody
                  value:
                    cmd: sv_kick NoSuchPlayer
                    dispatched: true
                    lines:
                      - { id: 1, time: 1788642719, src: audit, text: "sv - Admin - 0: : STEAM_0:0:0: sv_kick" }
                      - { id: 2, time: 1788642719, src: server, text: "No matching player" }
                unknown:
                  summary: No such command -- nothing is printed anywhere
                  value: { cmd: sv_nonsense, dispatched: false, lines: [] }
          x-fixtures:
            - runcommand-failed.json
            - runcommand-unknown.json
            - runcommand-slots.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [server]
      operationId: runCommandPost
      x-request: runcommand
      summary: Run a console command (form body)
      description: Identical to the `GET` form. See `runCommand`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, cmd]
              properties:
                request: { const: runcommand }
                cmd: { type: string }
      responses:
        "200":
          description: The command ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getlog":
    get:
      tags: [server]
      operationId: getLog
      x-request: getlog
      summary: The engine's log, since a byte offset
      description: |
        `log-Server.txt`, the engine's own log, read through
        `Shared.ReadLog` (10-12 engine) wherever `-logdir` puts it. See
        REQUIREMENTS.md item 7.

        It holds what never passes through Lua -- connects and auth, engine
        errors, `Script tracing`, Shine's chat and command lines -- and it
        **outlives a map change**: the file is the engine's, not Lua state.
        It is served **verbatim**: IPs, Steam ids and chat included (by
        design, 2026-09-28).

        With no cursor, the last 64 KB, starting at a line.
        Poll with `since` = the previous `to` and `file` = the previous
        `file_id`; page back with `before` = the first line's `off`. Only
        complete lines are served: a line the engine has not finished is held
        until it has. A reply carries at most 64 KB; `more`
        says to ask again at once. An idle poll reads nothing.

        `reset` replaces the cursor: `new_file` when the header's Date and
        Time differ from `file` (a restart moved the old log to
        `log-Server.old.txt`), `truncated` when the file is shorter than the
        cursor. The reply is then a fresh tail.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: Byte offset to read from, the previous reply's `to`.
          schema: { type: integer, minimum: 0 }
        - name: before
          in: query
          required: false
          description: |
            Byte offset to page back from, the first line's `off`. Up to
            64 KB before it, starting at a line. Ignored with `since`.
          schema: { type: integer, minimum: 0 }
        - name: file
          in: query
          required: false
          description: |
            The `file_id` the cursor belongs to. A different one is a
            `new_file` reset.
          schema: { type: string }
      responses:
        "200":
          description: Lines of the log, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
          x-fixtures:
            - getlog-rig-tail.json
            - getlog-rig-since.json
            - getlog-rig-reset.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getperf":
    get:
      tags: [performance]
      operationId: getPerf
      x-request: getperf
      summary: Performance windows since a cursor
      description: |
        What `perfmon` logs, served. The engine completes a
        `ServerPerformanceData` about once a second
        (`Shared.GetServerPerformanceData()`); the Lua accumulates them into
        windows of `window_s` seconds (10) and keeps `capacity` of them (360,
        an hour). Each window adds the tickrate counted from `UpdateServer`
        calls and the longest single tick, because the engine's own tick
        interval is whole milliseconds (16 at tickrate 60, read as 62.5).
        Measured on the rig; see REQUIREMENTS.md item 10.

        Poll with the `last_id` of the previous reply. **Paged**: a reply
        holds at most 60 windows past `since`, and `engine` at most 60
        records past `esince` across its three lists, oldest first; `more`
        (and `engine.more`) is `true` while the server holds more past
        `last_id`, and a client asks again at once. An hour in one reply
        cost most of a tick at 80 to encode (SERVER-COST.md).

        **Not persistent**: the
        buffer is Lua state, rebuilt at every map change, so the ids restart
        from 1 and `loaded_at` moves. A client that sees `loaded_at` change
        knows a map change happened and that windows between its last poll and
        the change are gone.

        `engine` carries the engine's own reports, read with a cursor of their
        own (`esince`): `tickstat` windows from `Server.GetTickStat()` (10-12
        engine), and what the engine prints only to `log-Server.txt` --
        snapshot rate steps, a bwlimit warning and the `perfmon:` block --
        found by a scan of the log every `scan_s` seconds. Same lifetime as
        the windows. REQUIREMENTS.md item 10.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: |
            Return windows with an id greater than this, at most 60. Omit
            or `0` to start from the oldest the buffer still holds.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: esince
          in: query
          required: false
          description: |
            Return `engine` records with an id greater than this, at most
            60. Omit or `0` to start from the oldest held.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Windows, oldest first, and the rates the server runs at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfReport" }
              examples:
                rig:
                  externalValue: ../fixtures/getperf-rig.json
                populated:
                  externalValue: ../fixtures/getperf-rig-populated.json
                tickstat:
                  externalValue: ../fixtures/getperf-rig-tickstat.json
          x-fixtures:
            - getperf-rig.json
            - getperf-rig-since.json
            - getperf-rig-populated.json
            - getperf-rig-tickstat.json
            - getperf-rig-tickstat-off.json
            - getperf-rig-perfmon.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getbans":
    get:
      tags: [players]
      operationId: getBans
      x-request: getbans
      summary: The bans in force, from whichever table decides them
      description: |
        Reads the table that actually decides who is banned: Shine's own when
        its ban plugin is on, which keeps who banned and when -- which
        `GetBannedPlayersList()` throws away -- and vanilla's otherwise.

        Normalized so a client need not know which it got: numeric ids,
        expired bans left out, a `permanent` flag in place of a sentinel
        time, a stable order, and the server's clock as `now`.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Bans in force, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BanList" }
          x-fixtures:
            - getbans.json
            - getbans-shine.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getrecentplayers":
    get:
      tags: [players]
      operationId: getRecentPlayers
      x-request: getrecentplayers
      summary: Players seen in the last 24 hours, connected or not
      description: |
        Every human seen in the last `window` seconds, at most
        `capacity` of them, so a player who has left can still be found and
        banned. Bots are never recorded.

        The list outlives a map change, which rebuilds all Lua state: it is
        kept in `config://webadmin/recent-players-{a,b}.json`, saved
        alternately so a torn write loses one save rather than the list.
        `storage` says how the load went and whether saves are working.

        `connected` is read off the live player list at request time. A
        connected player's `last_seen` is `now`.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Recent players, most recently seen first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentPlayers" }
          x-fixtures:
            - getrecentplayers.json
            - getrecentplayers-rig.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmapvote":
    get:
      tags: [maps]
      operationId: getMapVote
      x-request: getmapvote
      summary: What Shine's mapvote will do with the map cycle
      description: |
        `enabled: false` and nothing else when Shine's mapvote
        plugin is not on. When it is:

        - `maps_from_cycle`: the vote takes its options from the cycle
          (`GetMapsFromMapCycle`). Otherwise it uses its own map list and the
          cycle's maps are not what players vote on.
        - `options`: the maps the vote offers **now**. The plugin reads the
          cycle once, at map load, so after a `setmapcycle` this lags the
          file until the next map (measured, CONSTRAINTS item 13).
        - `round_limit`: rounds before the map ends, `0` for none. When set,
          it ends the map instead of the cycle's `time`, and `mode` plays no
          part either way.
        - `next_map`: `Plugin:GetNextMap()`, the vote's winner if there is
          one, else the next option after the current map. Absent when the
          plugin could not say.

        `getmapvote-off.json` is synthetic (`{"enabled": false}`); the Shine
        one is the rig's, on a Shine config.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The mapvote plugin's view of the cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVote" }
          x-fixtures:
            - getmapvote-off.json
            - getmapvote-shine.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ---------------------------------------------------------------- static

  /index.html:
    get:
      tags: [static]
      operationId: getPanel
      summary: The admin panel itself
      description: |
        `Shared.SetWebRoot("web")` serves `ns2/web/`. Files under the root
        are returned with a guessed content type (`.js` as the obsolete
        `application/x-javascript`). A bare `/` and anything not on disk get
        the panel too (`getRoot`), so **a missing asset never looks like a
        404**.
      responses:
        "200":
          description: The panel.
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

components:

  securitySchemes:
    digestAuth:
      type: http
      scheme: digest
      description: |
        HTTP Digest, MD5, handled by the engine (`ComputePasswordDigest` in
        `server_linux`), never by Lua. The realm is the `-webdomain` value, or
        `localhost` when unset. Credentials come from `-webuser` / `-webpassword`.

        Measured on the 26-09-03 build:

        - A nonce is **reusable** for its lifetime as long as the client
          increments `nc` -- ordinary RFC 7616 behaviour.
        - Replaying an already-used `nc` is refused `401` with `stale="true"`.
        - The nonce expires on **age, not idleness**: polled every 2 s, one
          nonce took 150 requests and was refused at **301 s**, `nc` having
          reached `00000097`. The refusal carries a fresh nonce, and the next
          request signed with it returns `200`.
        - 10 failed logins per address per minute earns a **1 minute
          lockout** -- back off on `401`, never retry-loop bad credentials.

        A browser absorbs all of this. Verified in headless Chrome: a
        `fetch()` poll left running 480 s at a 2 s cadence made 240 requests,
        all `200`, across a nonce expiry, with no prompt and no `401` visible
        to DevTools. **A polling panel needs no re-authentication logic of its
        own.**

        Still plain HTTP.

  parameters:
    RequestConst:
      name: request
      in: query
      required: true
      description: The action selector. Pinned to this operation's value.
      schema: { type: string }
    RequestJson:
      name: request
      in: query
      required: false
      description: |
        Any value that is not one of the fourteen actions, or no value at all,
        reaches the default handler. The panel sends `json` by convention.
      schema: { type: string, default: json }

  responses:
    DigestChallenge:
      description: |
        Digest challenge. `stale="true"` means the credentials were fine and
        only the nonce was old -- a browser retries silently. Repeated genuine
        failures trigger a one-minute per-address lockout after 10 in a minute.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: Digest qop="auth", realm="127.0.0.1", nonce="…", stale="true"

    ForeignOrigin:
      description: |
        Refused: the request carried an `Origin` header that does not match
        `Host`. Compared against the `Host` header, not against `-webdomain`.
        `Origin: null` is refused too; a request with no `Origin` at all is
        accepted. **This is why a Vite dev server on `:5173` cannot talk to a
        real game server** -- develop against `mock/server.js`.

        With **no login configured** (09-25 and later), a `Host` that is
        neither `localhost` nor an IP literal is refused `403` as well,
        static files included. See CONSTRAINTS.md, "The Host rule".

    BodyTooLarge:
      description: |
        Request body over the 64 KB cap, or a malformed `Content-Length`. The
        cap is measured; this exact status is not -- an over-cap body was never
        captured from a real server. Treat it as a refusal either way.

    Busy:
      description: |
        The request gave up after 30 s. This is the shape of a busy server, not
        a hard failure -- retry with backoff rather than surfacing an error.

  schemas:

    SteamId:
      type: integer
      description: |
        Steam id as the engine reports it (`client:GetUserId()`). `0` for bots.
        A number here, unlike mod ids, which are hex strings.
      examples: [10000000, 0]

    ModId:
      type: string
      pattern: "^[0-9a-f]+$"
      description: |
        A workshop id, lowercase hex, no `0x` prefix. JSON has no 64-bit
        integers, so the server converts with `string.format("%x", id)` on the
        way out and `tonumber64("0x"..mod)` on the way back in. **Round-trip it
        as a string; never parse it as a number.** `1e62a2ce` is workshop item
        `509780686`. `"0"` means "no mod" in `getmaplist`.
      examples: ["1e62a2ce", "0"]

    TeamNumber:
      type: integer
      description: |
        `0` ready room, `1` marines, `2` aliens, `3` spectators
        (`Globals.lua:119-122`).
      enum: [0, 1, 2, 3]

    Player:
      type: object
      description: One connected player, from `GetServerState()`.
      required:
        [name, steamid, isbot, team, iscomm, score, kills, assists, deaths,
         resources, ping, ipaddress, familyshared, moves_rejected_time,
         moves_rejected_other]
      properties:
        name: { type: string }
        steamid: { $ref: "#/components/schemas/SteamId" }
        isbot: { type: boolean }
        team: { $ref: "#/components/schemas/TeamNumber" }
        iscomm: { type: boolean }
        score: { type: integer }
        kills: { type: integer }
        assists: { type: integer }
        deaths: { type: integer }
        resources: { type: number }
        ping: { type: integer }
        ipaddress:
          type: string
          description: |
            **The player's full IP address**, served over plain HTTP to anyone
            who can authenticate. Mask by default and reveal per row on
            request. Live captures must never be committed -- the fixtures in
            this repo are redacted to `0.0.0.0`.
          examples: ["0.0.0.0"]
        gagged:
          type: boolean
          description: |
            **Under Shine's basecommands plugin**: muted with
            `sh_gag`, read through the plugin's `IsClientGagged`, which also
            expires a timed gag. Absent otherwise.
        familyshared:
          type: boolean
          description: |
            (`Server.GetIsFamilyShared`): playing a Steam Family
            Shared copy. Bots, the listen host and LAN players always read
            false (the engine's CHANGELOG).
        owner_steamid:
          allOf: [{ $ref: "#/components/schemas/SteamId" }]
          description: |
            Only with `familyshared: true`:
            `Server.GetOwnerUserId`, the account that owns the game.
        moves_rejected_time:
          type: number
          description: |
            (`ServerClient:GetMovesRejectedTimeCredit`): moves rejected for
            time credit, "usually a modified client" (CHANGELOG). Measured
            2026-10-06: an unmodified 09-28 client on the 09-27 rig, idle and
            minimized most of the time, climbed about 6/s, dropped once (75
            to 45) and restarted at a map change -- not a monotonic count,
            and not rare.
        moves_rejected_other:
          type: number
          description: |
            (`ServerClient:GetMovesRejectedOther`):
            moves rejected for anything else; "a poor connection can also
            cause these" (CHANGELOG).
        skill:
          type: number
          description: |
            `ScoringMixin:GetPlayerSkill()`: the Hive skill the
            server ranks and balances with (under UWE Hotfix 344, read from
            Steam User Stats). Absent for a player without ScoringMixin.
            `-1`, with all three below, when the server holds none: every
            bot, on the rig. Matched what Steam User Stats holds for a human
            on the rig (2026-10-07).
        skill_offset:
          type: number
          description: |
            `GetPlayerSkillOffset()`: marines play at `skill +
            skill_offset`, aliens at `skill - skill_offset`.
        comm_skill:
          type: number
          description: "`GetCommanderSkill()`: commander skill."
        comm_skill_offset:
          type: number
          description: |
            `GetCommanderSkillOffset()`, applied to `comm_skill`
            the same way.
        skill_tier:
          type: integer
          minimum: -2
          maximum: 7
          description: |
            `ScoringMixin:GetSkillTier()`: the tier the game
            draws the scoreboard's skill badge for. `-1` a bot, `-2` no
            skill, `0` a rookie (level 10 or below), else 1-7 from `skill`
            less `25 / sqrt(adagrad sum)`, the server's uncertainty, banded
            at 300, 750, 1400, 2100, 2900 and 4100 (`GetPlayerSkillTier`).
            Not team-relative, unlike the scoreboard's own badge. The game
            keeps its first answer for the rest of the map; the Lua puts back
            whatever was kept, so asking changes nothing. Absent with `skill`,
            or when `GetSkillTier()` errors.

    ServerState:
      type: object
      description: |
        `GetServerState()`. Also the response to every unrecognised request,
        and to a script at `/`.
      required:
        [cheats, devmode, map, players_online, marines, aliens, uptime,
         player_list, marine_res, alien_res, server_name, frame_rate,
         game_started, game_time, max_players]
      properties:
        cheats: { type: boolean }
        devmode: { type: boolean }
        map: { type: string, examples: [ns2_summit] }
        players_online:
          type: integer
          description: |
            Player entity count. Rendered before a disconnect completes, so a
            successful kick can still be reflected here -- verified: a kick
            that worked still reported 12.
        marines: { type: integer }
        aliens: { type: integer }
        uptime: { type: integer, description: "Seconds, `math.floor(Shared.GetTime())`." }
        player_list:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        marine_res: { type: number }
        alien_res: { type: number }
        server_name: { type: string }
        frame_rate: { type: number, description: "Current server tickrate." }
        game_started: { type: boolean }
        game_time:
          type: integer
          description: Seconds since round start, `0` when no round is running.
        max_players:
          type: integer
          description: |
            `Server.GetMaxPlayers()`. The reserved slot amount
            must not exceed it: `sv_reserved_slots` silently ignores a larger
            value.
          examples: [16]
        map_loaded_at:
          type: integer
          description: |
            When the current map loaded, Unix seconds
            (`Shared.GetSystemTime()` as the Lua VM starts, the same stamp
            as `getperf`'s `loaded_at`). The VM is rebuilt at every map
            change, so it is the last map change's time, from the server
            rather than from whenever a panel noticed.
          examples: [1791403505]
        ranking_active:
          type: boolean
          description: |
            `Server.GetIsRankingActive()`: whether the engine
            counts this server's rounds for ranking. It turns ranking on by
            itself when the server is not hidden, is dedicated, has no cheats
            or Lua hot reloading, has at most 5 spectator slots and 12 to 20
            player slots, and every mounted mod is whitelisted (CONSTRAINTS
            item 18).
          examples: [false]
        shine:
          $ref: "#/components/schemas/ShineState"

    ShineState:
      type: object
      description: |
        **Only when Shine is loaded** -- the key is absent otherwise. Whether each Shine plugin that replaces vanilla behaviour
        is enabled, read per request with `Shine:IsExtensionEnabled`, so a
        plugin loaded or unloaded at runtime shows up at once.

        - `ban`: Shine owns the ban list and redirects `sv_ban`/`sv_unban`.
          Ban with `sh_banid`, unban with `sh_unban`: an `sv_ban` of an id
          that is not connected reports success but lands only in the
          vanilla list, which is not enforced (measured 2026-09-27).
        - `reservedslots`: Shine sets the reserved slot count and grants
          access by the `sh_reservedslot` permission; the vanilla id list is
          not what is enforced.
        - `mapvote`: Shine decides the next map.
        - `basecommands`: Shine's
          `sh_gag`/`sh_ungag` exist, the only mute there is -- the game has
          no mute command (`sv_mute` never existed). Each player then carries
          `gagged`.
      required: [ban, reservedslots, mapvote, basecommands]
      properties:
        ban: { type: boolean }
        reservedslots: { type: boolean }
        mapvote: { type: boolean }
        basecommands: { type: boolean }
      examples:
        - { ban: true, reservedslots: false, mapvote: true, basecommands: true }

    BanEntry:
      type: object
      description: |
        One ban in force, as `getbans` reports it: the same record whether
        vanilla or Shine owns the list, with Shine's extra fields when it
        does.
      required: [id, name, reason, permanent]
      properties:
        id: { $ref: "#/components/schemas/SteamId" }
        name:
          type: string
          description: |
            `Unknown` (vanilla) or `<unknown>` (Shine) when the id was banned
            while not connected. Under Shine, such a ban is
            stored under the name the recent-players list last saw, when the
            player is in it.
        reason:
          type: string
          description: '`None provided` (vanilla) or `No reason given.` (Shine) when none was given.'
        permanent:
          type: boolean
          description: |
            True for an expiry of `0`, **and** for one more than 100 years
            away -- Shine stores `6e+24` for some permanent bans.
        expires:
          type: integer
          description: Unix seconds. Absent when `permanent`.
        issued: { type: integer, description: "**Shine only.** Unix seconds." }
        banned_by:
          type: string
          description: '**Shine only.** `Console` when banned from the web admin or the console.'

    BanList:
      type: object
      required: [source, now, bans]
      properties:
        source:
          type: string
          enum: [vanilla, shine]
          description: Which table the bans were read from.
        now:
          type: integer
          description: |
            The server's clock, in unix seconds. Measure time left against
            this, not against the browser's clock.
        bans:
          type: array
          description: |
            Bans in force only, newest first: Shine's by `issued`, vanilla's
            in reverse file order (vanilla appends).
          items: { $ref: "#/components/schemas/BanEntry" }

    RecentPlayer:
      type: object
      description: |
        One player seen recently. `steamid` and `ipaddress` are spelled as in
        `Player`, on purpose.
      required:
        [steamid, name, names, ipaddress, first_seen, last_seen, played, connected]
      properties:
        steamid: { $ref: "#/components/schemas/SteamId" }
        name: { type: string, description: "The name last seen. Empty until the first one is." }
        names:
          type: array
          description: Former names, newest first, at most 5.
          items: { type: string }
        ipaddress:
          type: string
          description: |
            **The player's full IP address** at their last connection, also
            written to the file under `config://`. Empty when the engine did
            not report one. Redacted in the fixtures.
          examples: ["0.0.0.0"]
        first_seen: { type: integer, description: "Unix seconds, within the window." }
        last_seen: { type: integer, description: "Unix seconds. `now` while connected." }
        played:
          type: number
          description: Seconds connected within the window, summed over sessions.
        connected: { type: boolean }

    RecentPlayers:
      type: object
      required: [now, window, capacity, storage, players]
      properties:
        now:
          type: integer
          description: The server's clock, in unix seconds.
        window:
          type: integer
          description: How far back the list reaches, in seconds (86400).
        capacity:
          type: integer
          description: At most this many players are kept (100); the oldest go first.
        storage:
          type: object
          required: [loaded]
          properties:
            loaded:
              type: string
              enum: [ok, empty, unreadable]
              description: |
                How this map's load went. `empty`: no file yet. `unreadable`:
                the save was torn, so the list started empty.
            error:
              type: string
              description: |
                Why the last save failed. Absent while saves work. When present,
                the list will not survive the next map change.
        players:
          type: array
          description: Most recently seen first.
          items: { $ref: "#/components/schemas/RecentPlayer" }

    ReservedSlotEntry:
      type: object
      required: [name, id]
      properties:
        name: { type: string, description: '`"None"` when added without one.' }
        id: { $ref: "#/components/schemas/SteamId" }

    ReservedSlots:
      type: object
      description: |
        `GetReservedSlotData()`. Both keys are absent when the server has no
        reserved-slot config, so the reply can be `{}`.

        Slots are keyed by **name** on the server, so adding a slot under a
        name that is already present replaces that slot.
      properties:
        amount: { type: integer, minimum: 0 }
        ids:
          type: array
          items: { $ref: "#/components/schemas/ReservedSlotEntry" }
        shine:
          type: object
          description: |
            Only while Shine's reservedslots plugin is on.
            Then Shine sets the count (`sh_setresslots`) and grants access by
            permission, so `amount` and `ids` are not what is enforced.
          required: [slots]
          properties:
            slots: { type: integer, minimum: 0 }

    ChatEntry:
      type: object
      description: |
        One entry of the chat ring. `steamId` is camel-cased here, `steamid`
        in `player_list` and `id` in a ban: three spellings for one value.
      required: [id, time, message, player, steamId, team, teamOnly]
      additionalProperties: false
      properties:
        id: { type: integer, description: "Increasing within a map, from 1." }
        time: { type: integer, description: "`Shared.GetSystemTime()`, unix seconds, when it was recorded." }
        message: { type: string }
        player: { type: string, description: "`Admin` for sv_say and sv_tsay." }
        steamId: { $ref: "#/components/schemas/SteamId" }
        team:
          allOf: [{ $ref: "#/components/schemas/TeamNumber" }]
          description: The team it was said to; 0 for sv_say.
        teamOnly: { type: boolean }

    ChatStream:
      type: object
      description: A page of the chat ring, from `getchatlist&since=`.
      required: [entries, last_id, dropped, buffer_size]
      additionalProperties: false
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ChatEntry" }
        last_id: { type: integer, description: "Pass as `since` on the next poll." }
        dropped:
          type: integer
          description: Entries that fell out of the ring before being read, this map.
        buffer_size: { type: integer, description: "Ring capacity, 200." }

    PerfReport:
      type: object
      required: [window_s, capacity, loaded_at, map, windows, last_id]
      properties:
        window_s: { type: integer, description: Seconds of engine samples per window. }
        capacity: { type: integer, description: Windows kept; the oldest is dropped. }
        loaded_at:
          type: integer
          description: |
            `Shared.GetSystemTime()` when this Lua VM loaded, i.e. the map
            load. A different value means the ids restarted.
        map: { type: string }
        config:
          type: object
          description: |
            The rates the server runs at now, from the engine's latest sample.
            A runtime `tickrate`, `sendrate`, `moverate` or `interp` shows at
            once. Absent until the engine's first sample after a map load.
          required: [tickrate, moverate, sendrate, interp_ms, max_players]
          properties:
            tickrate: { type: integer }
            moverate: { type: integer }
            sendrate: { type: integer }
            interp_ms: { type: integer }
            max_players: { type: integer }
            bw_limit:
              type: integer
              description: |
                `Server.GetBwLimit()`: bytes a second per player; follows a
                runtime `bwlimit`.
        windows:
          type: array
          items: { $ref: "#/components/schemas/PerfWindow" }
        last_id:
          type: integer
          description: |
            The last window in this reply when `more`, else the newest
            window's id; 0 before the first. Poll again with `since=<last_id>`.
        more:
          type: boolean
          description: |
            More windows are held past `last_id`: ask again at once.
        engine: { $ref: "#/components/schemas/PerfEngine" }

    PerfEngine:
      type: object
      description: |
        The engine's own reports: tickstat windows from
        `Server.GetTickStat()`, stamped with the time the window closed, and
        lines from `log-Server.txt`, stamped with the scan that found them
        (`time`, unix seconds): the lines carry no time of their own. One id
        sequence across all three lists.
      required: [scan_s, last_id, now, tickstats, perfmon, events]
      properties:
        now: { type: integer, description: "The server's clock, `Shared.GetSystemTime()`." }
        scan_s: { type: integer, description: Seconds between scans. }
        last_id:
          type: integer
          description: |
            Poll again with `esince=<last_id>`. The last record in this reply
            when `more`, else the newest.
        more:
          type: boolean
          description: |
            More records are held past `last_id`, at most 60 a reply across
            the three lists.
        tickstat_last_at:
          type: integer
          description: When the newest tickstat window closed. Absent when none did since the map load.
        tickstat_said:
          type: object
          description: "The last `tickstat: on|off` the command printed, when seen since the map load."
          required: [text, time]
          properties:
            text: { type: string }
            time: { type: integer }
        tickstats:
          type: array
          items: { $ref: "#/components/schemas/Tickstat" }
        perfmon:
          type: array
          items: { $ref: "#/components/schemas/PerfmonBlock" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EngineEvent" }

    Tickstat:
      type: object
      description: |
        One tickstat window, `Server.GetTickStat()` as the engine gives it,
        any field a newer engine adds included. `time` is the window's end on
        the server's system clock (the engine's own is server time).
      required: [id, time]
      properties:
        id: { type: integer }
        time: { type: integer }
        window: { type: number, description: Seconds the window covers. }
        hz: { type: number, description: Ticks delivered per second. }
        target: { type: integer, description: The configured tickrate. }
        intervalP50: { type: number, description: Tick spacing, median, ms. }
        intervalP99: { type: number }
        intervalP999: { type: number }
        intervalMax: { type: number }
        latenessMax: { type: number }
        rearms: { type: integer }
        stretchPct: { type: number, description: Share of ticks the server stretched. }
        governorMax: { type: integer }
        incomplete: { type: integer }
        loops: { type: integer }
        incompleteLate: { type: integer }
        incompleteWriters: { type: integer }
        incompleteMoves: { type: integer }
        waitOverP99: { type: number }
        waitOverMax: { type: number }
        waits: { type: integer }
        busyPct: { type: number }
        humans: { type: integer }
        bots: { type: integer }
        snapPerSecPerHuman: { type: number }
        bytesPerSecPerHuman: { type: number }
        movesPerSecPerHuman: { type: number }
        movesPerSecPerBot: { type: number }
        injectedPct: { type: number }
        moveMsPerTick: { type: number }
        specMovesPerSec: { type: number }
        specMoveMsPerTick: { type: number }
        snapBytesP50: { type: number }
        snapBytesP99: { type: number, description: "Size `bwlimit` from this: at least p99 x sendrate." }
        snapBytesMax: { type: integer }
        chokedPct: { type: number, description: Share of updates held back by bwlimit. }
        humanMoveMsPerTick: { type: number }
        sendBufDrops: { type: integer }
        rateStepped: { type: integer, description: Players whose update rate was lowered. }
        slowestSendrate: { type: number, description: The lowest update rate a player was at. }
        creationsDeferred: { type: integer }

    PerfmonBlock:
      type: object
      description: |
        The engine's `perfmon:` block, printed only when `perfmon` is typed. It
        covers the last second.
      required: [id, time]
      properties:
        id: { type: integer }
        time: { type: integer }
        jitter_avg_ms: { type: number }
        jitter_max_ms: { type: number }
        jitter_n: { type: integer }
        snapshot_write_avg_ms: { type: number }
        snapshot_write_max_ms: { type: number }
        snapshot_write_n: { type: integer }
        entities_skipped: { type: integer }
        entities_total: { type: integer }
        entities_skipped_pct: { type: number }
        rejected_time_credit: { type: integer }
        rejected_other: { type: integer }
        rewound_missing: { type: integer }
        score: { type: integer }
        idle_pct: { type: number }
        delivery_pct: { type: number }
        overload_pct: { type: number }
        updates: { type: integer }
        warn: { type: integer }
        fail: { type: integer }

    EngineEvent:
      oneOf:
        - type: object
          description: "`client N: snapshot rate A -> B/s (...)`: a player's update rate stepped."
          required: [id, time, kind, client, from_rate, to_rate, choked_pct, clear_ms, bwlimit]
          properties:
            id: { type: integer }
            time: { type: integer }
            kind: { const: rate }
            client: { type: integer, description: A slot number, not an identity. }
            from_rate: { type: number }
            to_rate: { type: number }
            choked_pct: { type: number }
            clear_ms: { type: number }
            bwlimit: { type: integer }
        - type: object
          description: The engine's warning that bwlimit leaves too few bytes per snapshot.
          required: [id, time, kind, bwlimit, sendrate, per_snapshot, needed, suggested]
          properties:
            id: { type: integer }
            time: { type: integer }
            kind: { const: bwlimit_low }
            bwlimit: { type: integer }
            sendrate: { type: integer }
            per_snapshot: { type: integer }
            needed: { type: integer }
            suggested: { type: integer, description: The bwlimit the engine says avoids it. }

    PerfWindow:
      type: object
      required: [id, time, tickrate, worst_tick_ms, players, score, idle_pct,
                 moves_pct, entities_pct, entities, interp_warns, interp_fails,
                 lua_kb]
      properties:
        id: { type: integer }
        time: { type: integer, description: "`Shared.GetSystemTime()` when the window closed." }
        tickrate: { type: number, description: "`UpdateServer` calls over the window's real duration." }
        worst_tick_ms: { type: number, description: The longest single tick. }
        players: { type: integer }
        score:
          type: integer
          description: |
            The engine's performance score, -99 to 100, higher better; perfmon
            colours it green from 10, yellow from 0, orange from -10, red
            below. 0 with nobody on the server, where it means nothing.
        idle_pct: { type: number }
        moves_pct: { type: number, description: Share of the window spent on player moves. }
        entities_pct: { type: number, description: Share spent updating other entities. }
        entities: { type: integer, description: Average entity count. }
        interp_warns:
          type: integer
          description: Late updates to a player (interval > 0.75 x interp), counted over the window.
        interp_fails:
          type: integer
          description: Updates at or past interp, counted over the window. Should stay 0.
        lua_kb: { type: integer, description: "`collectgarbage(\"count\")`: the Lua heap." }

    InstalledMod:
      type: object
      required: [id, name, active, whitelisted]
      properties:
        id: { $ref: "#/components/schemas/ModId" }
        name:
          type: string
          description: |
            The workshop title. For a mod the server holds no details of, the
            engine gives its decimal workshop id instead (`"1423731186"` on the
            rig, a download that never completed).
        active:
          type: boolean
          description: |
            Mounted now. Fixed when the map loads: the cycle's
            global `mods`, the loaded map's own `mods`, and two hotfix mods
            (UWE Hotfix 344, NSL Badges) that the engine mounts with no cycle
            entry. A cycle edit changes it only at the next map change.
            Measured on the 09-26 rig with Shine and 23 mods.
        whitelisted:
          type: boolean
          description: |
            On the ranked-mod whitelist the engine read at boot:
            `Server.GetIsModWhitelisted`. True for the hotfix mods too (UWE
            Hotfix 344, NSL Badges; measured on the 10-12 rig). Never unknown:
            if the engine could not read the list, every mod reads false.

    MapListEntry:
      type: object
      required: [name, modId]
      properties:
        name: { type: string, examples: [ns2_summit] }
        modId:
          allOf: [{ $ref: "#/components/schemas/ModId" }]
          description: '`"0"` for a stock map, otherwise the mod that provides it.'

    MapCycleEntry:
      description: |
        Either a bare map name, or an object naming the mods that map needs.
      oneOf:
        - type: string
          examples: [ns2_summit]
        - type: object
          required: [map]
          description: |
            Shine's mapvote reads further keys here (`min`, `max`, `chance`,
            `percent`, `time`, `rounds`, ...). The game ignores them and
            `setmapcycle` passes them through; a client must keep them.
          additionalProperties: true
          properties:
            map: { type: string }
            mods:
              type: array
              items: { $ref: "#/components/schemas/ModId" }

    MapCycle:
      type: object
      description: |
        `config://MapCycle.json` with mod ids hex-encoded. Read it, edit it and
        write the whole document back with `setmapcycle`; there is no partial
        update. A 17-map cycle is 263 bytes.

        `ModIdsFromHex` **skips any string containing `:`**, which is how an
        entry can name a non-workshop source and survive the round trip.

        Other keys are allowed and must survive a round trip: Shine's mapvote
        reads map `groups` from here, for one.
      additionalProperties: true
      properties:
        maps:
          type: array
          items: { $ref: "#/components/schemas/MapCycleEntry" }
        time:
          type: number
          description: Minutes before the cycle advances.
        mode:
          type: string
          description: |
            `order` plays the list in sequence; `random` shuffles. The panel
            writes only these two (`mapcycle.js:117`).
          examples: [order, random]
        mods:
          type: array
          description: Mods mounted for the whole cycle, hex ids.
          items: { $ref: "#/components/schemas/ModId" }
        groups:
          type: array
          description: Shine's mapvote map groups. Opaque to the game.

    MapCycleWrite:
      description: The answer to `setmapcycle`.
      oneOf:
        - type: object
          required: [ok, cycle]
          additionalProperties: false
          properties:
            ok: { const: true }
            cycle:
              allOf: [{ $ref: "#/components/schemas/MapCycle" }]
              description: '`config://MapCycle.json` read back after the write, hex-encoded.'
        - type: object
          required: [ok, error]
          additionalProperties: false
          properties:
            ok: { const: false }
            error:
              type: string
              description: 'Why nothing was written, e.g. `mods[1] is not a hex mod id: zzzz`.'

    MapVote:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maps_from_cycle: { type: boolean }
        round_limit: { type: integer, minimum: 0 }
        next_map: { type: string }
        options:
          type: array
          items: { type: string }

    WorkshopItem:
      type: object
      description: One workshop search hit, as `Server.SearchWorshop` returns it.
      required:
        [id, title, description, authorid, filesize, tags, steamresult,
         childcount, thumbnailurl, version]
      properties:
        id:
          allOf: [{ $ref: "#/components/schemas/ModId" }]
          description: Hex-encoded on the way out, line 260. Feed it to `installmod`.
        title: { type: string }
        description: { type: string, description: "Steam BBCode, not HTML. Escape before rendering." }
        authorid:
          type: string
          description: |
            The author's 64-bit SteamID64, as a **string** -- unlike `steamid`
            in `player_list`, which is a number.
          examples: ["76561197980112344"]
        filesize: { type: integer, description: "Bytes." }
        tags: { type: string, description: "Comma-separated, possibly empty." }
        steamresult: { type: integer, description: "Steam's own result code; `1` is OK." }
        childcount: { type: integer }
        thumbnailurl:
          type: string
          format: uri
          description: |
            An `images.steamusercontent.com` URL -- **off-server and HTTPS**,
            on a panel served over plain HTTP. On an isolated network these do
            not load; the client should tolerate broken thumbnails.
        version: { type: integer, description: "Unix timestamp of the item's last update." }
        whitelisted:
          type: boolean
          description: |
            On the ranked-mod whitelist the engine read at boot,
            as for `InstalledMod`.

    ConsoleLine:
      type: object
      description: |
        One captured line.
      required: [id, time, src, text]
      properties:
        id: { type: integer, description: "The line's place in the reply, from 1." }
        time: { type: integer, description: "Unix seconds, `Shared.GetSystemTime()`." }
        src:
          type: string
          enum: [audit, server]
          description: |
            `audit` the dispatch receipt the game emits before every command
            created by `CreateServerAdminCommand`; `server` anything else. A
            console should show `server` and can hide `audit`.
        text: { type: string }

    CommandResult:
      type: object
      description: |
        The result of `runCommand`.
      required: [cmd, dispatched, lines]
      properties:
        cmd: { type: string, description: "The command line as sent." }
        dispatched:
          type: boolean
          description: |
            The command was dispatched as an admin command, proven by its audit
            line. `false` means a plain console command or no such command --
            indistinguishable on the server side.
        lines:
          type: array
          description: |
            What it printed. **Empty is not failure** -- a successful `sv_kick`
            prints nothing.
          items: { $ref: "#/components/schemas/ConsoleLine" }

    LogLine:
      type: object
      description: One line of the log, without its newline.
      # Quoted: YAML 1.1 reads a bare `off` as the boolean false.
      required: ["off", text]
      additionalProperties: false
      properties:
        "off":
          type: integer
          minimum: 0
          description: |
            Byte offset of the line in the file: unique within a file, so a
            client merges replies by it. Bytes, not characters.
        text:
          type: string
          description: |
            Verbatim, a trailing CR dropped. The engine writes bytes, not
            necessarily UTF-8; what is not valid UTF-8 arrives as such and a
            browser decodes it to U+FFFD.

    LogPage:
      type: object
      description: A stretch of `log-Server.txt`.
      required: [file_id, size, from, to, lines, more, at_start]
      additionalProperties: false
      properties:
        file_id:
          type: string
          description: |
            The header's Date and Time, e.g. `09/28/2026 02:50:11 AM`; empty
            for a file without the header. Pass back as `file`.
        size: { type: integer, minimum: 0, description: "The file's size now, in bytes." }
        from: { type: integer, minimum: 0, description: "Offset of the first byte served." }
        to:
          type: integer
          minimum: 0
          description: |
            Offset after the last complete line served: the next `since`.
            Below `size` when a line is still being written or `more` is set.
        lines:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        more: { type: boolean, description: "Stopped at `max_bytes`; ask again at once." }
        at_start: { type: boolean, description: "`from` is 0: nothing earlier to page to." }
        reset:
          type: string
          enum: [new_file, truncated]
          description: The cursor did not fit this file; this reply is a fresh tail.

    WorkshopSearchResult:
      description: |
        Two shapes on one status code: still loading, or settled. A failed
        search is indistinguishable from an empty one (Steam's failure comes
        back as no items); one with no answer after 30 s settles with
        `error`.
      oneOf:
        - type: object
          title: Loading
          required: [loading, elapsed]
          additionalProperties: false
          properties:
            loading: { type: boolean, const: true }
            elapsed:
              type: number
              description: Seconds since this search started.
        - type: object
          title: Settled
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 50
              description: |
                At most 50: the engine hands over no more.
                Empty for no matches and for a search Steam failed alike.
              items: { $ref: "#/components/schemas/WorkshopItem" }
            capped:
              type: boolean
              description: |
                50 hits: the search may have found more than it returned.
                Absent when `error` is set.
            error:
              type: string
              description: |
                The search had no answer after 30 s. Reported once; the next
                request starts a fresh search.

    InstallModResult:
      description: The answer to `installmod`.
      oneOf:
        - type: object
          required: [ok, id, already_installed]
          additionalProperties: false
          properties:
            ok: { const: true }
            id:
              allOf: [{ $ref: "#/components/schemas/ModId" }]
              description: The id as sent to `Server.InstallMod`, lower case, no leading zeros.
            already_installed:
              type: boolean
              description: |
                It was in `getinstalledmodslist` already. The engine then checks
                it for an update and downloads nothing if it is current.
        - type: object
          required: [ok, error]
          additionalProperties: false
          properties:
            ok: { const: false }
            error:
              type: string
              description: 'Why nothing was sent to the engine, e.g. `Not a hex workshop id: zz`.'

