  "/#request=installmod":
    get:
      tags: [mods]
      operationId: installMod
      x-request: installmod
      summary: Download a workshop mod
      description: |
        `Server.InstallMod(actions.modid)`, `ServerWebInterface.lua:214`. The
        shipped panel sends this as a `GET` (`modbrowser.js:25`).

        Asynchronous. On stock the empty `200` says only that the request was
        received: `Server.InstallMod` returns nothing, and drops an id it
        cannot parse without a word (`zz`, `0` and an empty id leave no log
        line; `-5` became mod 18446744073709551611, which Steam then reported
        as not found -- measured on 09-26). **With the mod** the reply is JSON:
        a malformed id is refused before the call, and an accepted one says
        whether it was installed already.

        Either way, the only proof of a download is `getinstalledmodslist`: a
        mod is listed once it is downloaded and unpacked, under its real
        title, and never before (1.7 s for a 710-byte mod, 3.8 s for 26 MB on
        the rig). An id Steam does not have never arrives. Re-installing an
        installed mod checks it and downloads nothing when it is current.

        **Loading a non-whitelisted mod silently unranks the server** -- the
        log says `Ranking disabled: server has non-whitelisted mods mounted`
        and `Requesting server ranking be enabled, request success: false`.
        Removing the mod restores ranking. Nothing in the API surfaces this;
        a client should warn before installing.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: modid
          in: query
          required: true
          description: |
