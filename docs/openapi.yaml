openapi: 3.1.0

info:
  title: NS2 dedicated server web admin API
  version: "344+26-10-15"
  summary: The HTTP surface of the server web admin, as `ServerWebInterface.lua` implements it.
  description: |
    Implemented by `ServerWebInterface.lua`. Needs the 10-12 beta engine or
    later.

    ## One endpoint

    Every call is a `GET` or `POST` to `/`, and the `request` parameter picks
    the action. A `GET` takes its parameters from the query string, a `POST`
    from its form body; a `POST`'s query string is ignored.

    OpenAPI keys operations by path, so each action here is keyed by a URL
    fragment naming its `request` value:

        /#request=getbans   ->   GET /?request=getbans

    The fragment is not part of the wire format. `x-request` on each
    operation carries the same value.

    ## For clients

    - **No 404.** A path that is not a file under the web root gets the
      panel (`getRoot`), and an unknown `request` value gets the server
      state, both with `200`.
    - **Method is not enforced.** Every write also works as a `GET`. `PUT`,
      `DELETE`, `HEAD` and `OPTIONS` get `405` from the engine.
    - **Replies are JSON.** A write says what it did or why it refused.
    - **Steam ids are numbers, mod ids hex strings.**
    - **Player rows carry full IP addresses**, over plain HTTP.

servers:
  - url: http://{host}:{port}
    description: A dedicated server started with -webadmin
    variables:
      host:
        default: 127.0.0.1
        description: The -webdomain value, or the server's address.
      port:
        default: "8080"
        description: The -webport value.

security:
  - digestAuth: []

tags:
  - name: server
    description: Server state and console commands.
  - name: players
    description: Bans, reserved slots and recent players.
  - name: chat
    description: The in-game chat history.
  - name: performance
    description: Performance windows and the engine's own reports.
  - name: maps
    description: Map list, map cycle and Shine's mapvote.
  - name: mods
    description: Installed mods and workshop search.
  - name: static
    description: The panel's own files, served from the web root.

paths:

  # ---------------------------------------------------------------- server

  "/#no-parameters":
    get:
      tags: [server]
      operationId: getRoot
      summary: A request with no parameters
      description: |
        `/`, any path that is not a file, `/?`, `/?foo` (a key without `=`)
        or a `POST` with an empty body.

        At `/`, a request whose `Accept` names `text/html` gets the panel,
        anything else the server state. Any other path gets the panel. If
        `web/index.html` cannot be read, the panel is a page that refreshes
        to `/index.html`.
      responses:
        "200":
          description: >
            The panel for a browser at `/` and for any other path, the server
            state for a script at `/`.
          content:
            text/html:
              schema: { type: string }
              examples:
                fallback:
                  summary: A browser at `/` when web/index.html cannot be read
                  externalValue: ../fixtures/root-fallback.html
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=json":
    get:
      tags: [server]
      operationId: getServerState
      x-request: json
      summary: Server state (the default response)
      description: |
        `GetServerState()`. Also the answer to any `request` value not listed
        here, and to parameters without `request`.
      parameters:
        - $ref: "#/components/parameters/RequestJson"
      responses:
        "200":
          description: Server state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerState" }
              examples:
                empty:
                  summary: No players
                  externalValue: ../fixtures/serverstate.json
                populated:
                  summary: Players, game in progress, Shine loaded
                  externalValue: ../fixtures/serverstate-shine-populated.json
          x-fixtures:
            - serverstate.json
            - serverstate-shine-populated.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # --------------------------------------------------------------- players

  "/#request=getreservedslots":
    get:
      tags: [players]
      operationId: getReservedSlots
      x-request: getreservedslots
      summary: Reserved slot count and the ids that hold them
      description: |
        `GetReservedSlotData()`. `{}` when the server has no reserved-slot
        config.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Reserved slot configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservedSlots" }
              examples:
                empty:
                  externalValue: ../fixtures/getreservedslots.json
          x-fixtures:
            - getreservedslots.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ chat

  "/#request=getchatlist":
    get:
      tags: [chat]
      operationId: getChatList
      x-request: getchatlist
      summary: The chat, since a cursor
      description: |
        `Server.recentChatMessages`: the last 200 entries, each with its
        time. Holds player chat, `sv_say`, `sv_tsay` and Shine's `sh_say`.

        Poll with the previous reply's `last_id`. Ids restart from 1 at every
        map change.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: |
            Return entries with an id greater than this. Missing or not a
            number reads as `0`.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Chat entries, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatStream" }
              examples:
                player:
                  externalValue: ../fixtures/getchatlist-player.json
          x-fixtures:
            - getchatlist.json
            - getchatlist-since.json
            - getchatlist-restarted.json
            - getchatlist-player.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ maps

  "/#request=getmaplist":
    get:
      tags: [maps]
      operationId: getMapList
      x-request: getmaplist
      summary: Maps installed on the server
      description: |
        `GetMapList()`: every map the server can load, with the mod that
        provides it (`"0"` for a stock map).
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Installed maps.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MapListEntry" }
              examples:
                stockMaps:
                  externalValue: ../fixtures/getmaplist.json
                modded:
                  externalValue: ../fixtures/getmaplist-modded.json
          x-fixtures:
            - getmaplist.json
            - getmaplist-modded.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmapcycle":
    get:
      tags: [maps]
      operationId: getMapCycle
      x-request: getmapcycle
      summary: The current map cycle
      description: |
        `config://MapCycle.json`, mod ids hex-encoded. If the file is missing
        or does not parse, the cycle the map loaded with.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The map cycle, mod ids hex-encoded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapCycle" }
              examples:
                stockMaps:
                  externalValue: ../fixtures/getmapcycle.json
                modded:
                  externalValue: ../fixtures/getmapcycle-modded.json
                shine-options:
                  externalValue: ../fixtures/getmapcycle-shine-options.json
          x-fixtures:
            - getmapcycle.json
            - getmapcycle-before.json
            - getmapcycle-after.json
            - getmapcycle-modded.json
            - getmapcycle-shine-options.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=setmapcycle":
    post:
      tags: [maps]
      operationId: setMapCycle
      x-request: setmapcycle
      summary: Replace the map cycle
      description: |
        Replaces the whole cycle; there is no partial update. The cycle is a
        JSON string in the `data` form field, not a JSON body.

        Refused, with nothing written, unless `maps` is a non-empty list of
        names or `{map}` objects, `time` a number >= 0, `mode` `order` or
        `random`, and every mod id hex or containing `:`. Other keys pass
        through. The reply holds the file as read back after the write.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, data]
              properties:
                request: { const: setmapcycle }
                data:
                  type: string
                  description: A `MapCycle` as JSON, mod ids as hex strings.
                  contentMediaType: application/json
                  contentSchema: { $ref: "#/components/schemas/MapCycle" }
            example:
              request: setmapcycle
              data: '{"time":30,"mode":"order","maps":["ns2_summit","ns2_veil"],"mods":["1e62a2ce"]}'
      responses:
        "200":
          description: |
            `ok` and either the cycle as the file now holds it or the reason
            it was refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapCycleWrite" }
              examples:
                written:
                  externalValue: ../fixtures/setmapcycle-ok.json
                refused:
                  externalValue: ../fixtures/setmapcycle-refused.json
          x-fixtures:
            - setmapcycle-ok.json
            - setmapcycle-refused.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmapvote":
    get:
      tags: [maps]
      operationId: getMapVote
      x-request: getmapvote
      summary: What Shine's mapvote will do with the map cycle
      description: |
        `{"enabled": false}` when Shine's mapvote plugin is off. Otherwise:

        - `maps_from_cycle`: the vote's options come from the map cycle, else
          from the plugin's own list.
        - `options`: the maps the vote offers now. Read from the cycle at map
          load, so a `setmapcycle` shows here from the next map.
        - `round_limit`: rounds before the map ends, `0` for none. When set,
          it ends the map instead of the cycle's `time`.
        - `next_map`: the vote's winner, else the option after the current
          map. Absent when the plugin cannot say.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The mapvote plugin's view of the cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVote" }
          x-fixtures:
            - getmapvote-off.json
            - getmapvote-shine.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ------------------------------------------------------------------ mods

  "/#request=getinstalledmodslist":
    get:
      tags: [mods]
      operationId: getInstalledModsList
      x-request: getinstalledmodslist
      summary: Mods downloaded to the server, mounted or not
      description: |
        `GetModList()`: every mod downloaded to the server. A mod is mounted
        only when the map cycle names it and the map changes (`active`).
        Nothing removes a downloaded mod.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Installed mods.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstalledMod" }
              examples:
                installed:
                  externalValue: ../fixtures/getinstalledmodslist.json
          x-fixtures:
            - getinstalledmodslist.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=installmod":
    get:
      tags: [mods]
      operationId: installMod
      x-request: installmod
      summary: Download a workshop mod
      description: |
        `Server.InstallMod`. Asynchronous: the mod appears in
        `getinstalledmodslist` once downloaded, and an id Steam does not have
        never does. A malformed id is refused. Installing a mod that is there
        already checks it for an update.

        Mounting a mod that is not whitelisted unranks the server; see
        `whitelisted` and `ranking_active`.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: modid
          in: query
          required: true
          description: Workshop id as a hex string.
          schema: { $ref: "#/components/schemas/ModId" }
          example: 1e62a2ce
      responses:
        "200":
          description: "`ok` and what was done, or why the id was refused."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallModResult" }
              examples:
                alreadyInstalled:
                  externalValue: ../fixtures/installmod-already.json
                refused:
                  externalValue: ../fixtures/installmod-refused.json
          x-fixtures:
            - installmod-already.json
            - installmod-refused.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [mods]
      operationId: installModPost
      x-request: installmod
      summary: Download a workshop mod (form body)
      description: As the `GET` form.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, modid]
              properties:
                request: { const: installmod }
                modid: { $ref: "#/components/schemas/ModId" }
      responses:
        "200":
          description: As for the `GET` form.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallModResult" }
              examples:
                installed:
                  externalValue: ../fixtures/installmod-ok.json
          x-fixtures:
            - installmod-ok.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmods":
    get:
      tags: [mods]
      operationId: getMods
      x-request: getmods
      summary: Search the Steam workshop (poll until settled)
      description: |
        Starts `Server.SearchWorshop` and answers `loading` until it settles;
        poll the same URL. At most 50 hits, in relevance order, no paging. No
        matches and a failed search both settle with no items. A search with
        no answer after 30 s settles once with `error`, and the next request
        starts a new one. Settled results are cached for 60 s by search text.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: searchtext
          in: query
          required: false
          description: Free-text query. Missing reads as `""`, everything.
          schema: { type: string, default: "" }
          example: combat
      responses:
        "200":
          description: Either still loading, or settled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkshopSearchResult" }
              examples:
                loading:
                  summary: Every call until the search settles
                  externalValue: ../fixtures/getmods-loading.json
                settled:
                  summary: Six hits
                  externalValue: ../fixtures/getmods-settled.json
                empty:
                  summary: No matches, or a failed search
                  externalValue: ../fixtures/getmods-empty.json
                timedOut:
                  summary: A search with no answer after 30 s
                  value: { items: [], error: "The workshop search had no answer after 30 s." }
          x-fixtures:
            - getmods-loading.json
            - getmods-settled.json
            - getmods-capped.json
            - getmods-empty.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # --------------------------------------------------------------- console

  "/#request=runcommand":
    get:
      tags: [server]
      operationId: runCommand
      x-request: runcommand
      summary: Run a console command and return what it printed
      description: |
        Runs the command with `Shared.CaptureConsoleCommand` and returns what
        it printed: script, engine and Shine lines, which also reach the log.
        Under Shine, vanilla `sv_` commands print here as they do without it.

        - `dispatched: true`: an admin command (`CreateServerAdminCommand`)
          ran. `false`: a plain console command, or no such command; the two
          look the same.
        - `lines`: what it printed, in order: `audit` for the dispatch
          receipt, `server` for the rest, without the log's `[hh:mm:ss]`.
        - An empty `lines` with `dispatched: true` is not failure: a
          successful `sv_kick` prints nothing.

        Only what the command prints before it returns is captured; the rest
        is in the log (`getLog`).
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: cmd
          in: query
          required: true
          description: The command line, as typed at the server console.
          schema: { type: string }
          examples:
            kick: { value: "sv_kick 10000000" }
            slots: { value: "sv_reserved_slots 3" }
      responses:
        "200":
          description: The command ran. What it printed, if anything, is in `lines`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
              examples:
                failed:
                  summary: A kick that matched nobody
                  value:
                    cmd: sv_kick NoSuchPlayer
                    dispatched: true
                    lines:
                      - { id: 1, time: 1788642719, src: audit, text: "sv - Admin - 0: : STEAM_0:0:0: sv_kick" }
                      - { id: 2, time: 1788642719, src: server, text: "No matching player" }
                unknown:
                  summary: No such command
                  value: { cmd: sv_nonsense, dispatched: false, lines: [] }
          x-fixtures:
            - runcommand-failed.json
            - runcommand-unknown.json
            - runcommand-slots.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }
    post:
      tags: [server]
      operationId: runCommandPost
      x-request: runcommand
      summary: Run a console command (form body)
      description: As the `GET` form.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, cmd]
              properties:
                request: { const: runcommand }
                cmd: { type: string }
      responses:
        "200":
          description: The command ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getlog":
    get:
      tags: [server]
      operationId: getLog
      x-request: getlog
      summary: The engine's log, since a byte offset
      description: |
        `log-Server.txt`, read with `Shared.ReadLog`, verbatim: IPs, Steam
        ids and chat included. It outlives a map change.

        With no cursor, the last 64 KB, from the start of a line. Poll with
        `since` = the previous `to` and `file` = the previous `file_id`; page
        back with `before` = the first line's `off`. Only complete lines are
        served. A reply carries at most 64 KB; `more` says to ask again at
        once.

        `reset` replaces the cursor, and the reply is a fresh tail:
        `new_file` when the file's header differs from `file` (the server
        restarted), `truncated` when the file is shorter than the cursor.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: Byte offset to read from, the previous reply's `to`.
          schema: { type: integer, minimum: 0 }
        - name: before
          in: query
          required: false
          description: |
            Byte offset to page back from, the first line's `off`. Up to
            64 KB before it, from the start of a line. Ignored with `since`.
          schema: { type: integer, minimum: 0 }
        - name: file
          in: query
          required: false
          description: The `file_id` the cursor belongs to.
          schema: { type: string }
      responses:
        "200":
          description: Lines of the log, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
          x-fixtures:
            - getlog-rig-tail.json
            - getlog-rig-since.json
            - getlog-rig-reset.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getperf":
    get:
      tags: [performance]
      operationId: getPerf
      x-request: getperf
      summary: Performance windows since a cursor
      description: |
        `Shared.GetServerPerformanceData()` samples, about one a second,
        summed into windows of `window_s` seconds (10). The last `capacity`
        windows (360, an hour) are kept. Each window also has the tickrate
        counted from `UpdateServer` calls and the longest tick.

        Poll with the previous `last_id` as `since`. A reply holds at most 60
        windows; `more` says to ask again at once.

        `engine` holds the engine's own reports, under a cursor of its own
        (`esince`, at most 60 records a reply): `tickstat` windows from
        `Server.GetTickStat()`, and, from `log-Server.txt` scanned every
        `scan_s` seconds, snapshot rate steps, the bwlimit warning and
        `perfmon:` blocks.

        Both are emptied at a map change: ids restart from 1 and `loaded_at`
        changes.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
        - name: since
          in: query
          required: false
          description: |
            Return windows with an id greater than this, at most 60. Missing
            or `0`: from the oldest held.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: esince
          in: query
          required: false
          description: |
            Return `engine` records with an id greater than this, at most 60.
            Missing or `0`: from the oldest held.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Windows, oldest first, and the rates the server runs at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfReport" }
              examples:
                rig:
                  externalValue: ../fixtures/getperf-rig.json
                populated:
                  externalValue: ../fixtures/getperf-rig-populated.json
                tickstat:
                  externalValue: ../fixtures/getperf-rig-tickstat.json
          x-fixtures:
            - getperf-rig.json
            - getperf-rig-since.json
            - getperf-rig-populated.json
            - getperf-rig-tickstat.json
            - getperf-rig-tickstat-off.json
            - getperf-rig-perfmon.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getbans":
    get:
      tags: [players]
      operationId: getBans
      x-request: getbans
      summary: The bans in force
      description: |
        Shine's bans when its ban plugin is on, vanilla's otherwise, in one
        shape. Expired bans are left out.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Bans in force, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BanList" }
          x-fixtures:
            - getbans.json
            - getbans-shine.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getrecentplayers":
    get:
      tags: [players]
      operationId: getRecentPlayers
      x-request: getrecentplayers
      summary: Players seen in the last 24 hours, connected or not
      description: |
        Every human seen in the last `window` seconds, at most `capacity` of
        them. Kept across map changes in
        `config://webadmin/recent-players.json`; `storage` says how it loaded
        and whether saves work. A connected player's `last_seen` is `now`.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: Recent players, most recently seen first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentPlayers" }
          x-fixtures:
            - getrecentplayers.json
            - getrecentplayers-rig.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ---------------------------------------------------------------- static

  /index.html:
    get:
      tags: [static]
      operationId: getPanel
      summary: The admin panel itself
      description: |
        Files under `web/` are served by the engine, with a content type from
        the extension (`.js` as `application/x-javascript`). Anything else
        gets the panel (`getRoot`).
      responses:
        "200":
          description: The panel.
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

components:

  securitySchemes:
    digestAuth:
      type: http
      scheme: digest
      description: |
        HTTP Digest (MD5), over plain HTTP, handled by the engine. Realm: the
        `-webdomain` value, or `localhost`. Credentials: `-webuser` and
        `-webpassword`.

        A nonce lasts about 300 s from issue and is reusable with an
        increasing `nc`. A reused `nc` or an expired nonce gets `401` with
        `stale="true"` and a new nonce. 10 failed logins from one address in
        a minute lock it out for a minute.

  parameters:
    RequestConst:
      name: request
      in: query
      required: true
      description: The action, fixed for each operation.
      schema: { type: string }
    RequestJson:
      name: request
      in: query
      required: false
      description: Any value that is not an action listed here, or none. The panel sends `json`.
      schema: { type: string, default: json }

  responses:
    DigestChallenge:
      description: |
        Digest challenge. `stale="true"`: the nonce expired; retry with the
        new one. 10 failures from one address in a minute lock it out for a
        minute.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: Digest qop="auth", realm="127.0.0.1", nonce="…", stale="true"

    ForeignOrigin:
      description: |
        An `Origin` header that does not match `Host`, `Origin: null`
        included; a request without `Origin` is accepted. With no login
        configured, also a `Host` that is neither `localhost` nor an IP
        literal, static files included.

    BodyTooLarge:
      description: A body over 64 KB, or a malformed `Content-Length`.

    Busy:
      description: The request gave up after 30 s. The server is busy; retry later.

  schemas:

    SteamId:
      type: integer
      description: "`client:GetUserId()`. `0` for bots."
      examples: [10000000, 0]

    ModId:
      type: string
      pattern: "^[0-9a-f]+$"
      description: |
        A workshop id in lowercase hex, no `0x`. Keep it a string: it does
        not fit a JSON number. `1e62a2ce` is workshop item `509780686`. `"0"`
        is no mod, in `getmaplist`.
      examples: ["1e62a2ce", "0"]

    TeamNumber:
      type: integer
      description: "`0` ready room, `1` marines, `2` aliens, `3` spectators."
      enum: [0, 1, 2, 3]

    Player:
      type: object
      description: One connected player.
      required:
        [name, steamid, isbot, team, iscomm, score, kills, assists, deaths,
         resources, ping, ipaddress, familyshared, moves_rejected_time,
         moves_rejected_other]
      properties:
        name: { type: string }
        steamid: { $ref: "#/components/schemas/SteamId" }
        isbot: { type: boolean }
        team: { $ref: "#/components/schemas/TeamNumber" }
        iscomm: { type: boolean }
        score: { type: integer }
        kills: { type: integer }
        assists: { type: integer }
        deaths: { type: integer }
        resources: { type: number }
        ping: { type: integer }
        ipaddress:
          type: string
          description: The player's full IP address.
          examples: ["0.0.0.0"]
        gagged:
          type: boolean
          description: |
            Under Shine's basecommands plugin: gagged with `sh_gag`. Absent
            otherwise.
        familyshared:
          type: boolean
          description: |
            `Server.GetIsFamilyShared`: playing a Steam Family Shared copy.
            Always false for bots, the listen host and LAN players.
        owner_steamid:
          allOf: [{ $ref: "#/components/schemas/SteamId" }]
          description: |
            Only with `familyshared: true`: `Server.GetOwnerUserId`, the
            account that owns the game.
        moves_rejected_time:
          type: number
          description: |
            `GetMovesRejectedTimeCredit`: moves rejected for time credit.
            Not a monotonic count; restarts at a map change.
        moves_rejected_other:
          type: number
          description: "`GetMovesRejectedOther`: moves rejected for any other reason."
        skill:
          type: number
          description: |
            `GetPlayerSkill()`: Hive skill. `-1`, with the three below, when
            the server holds none (bots). Absent for a player without
            ScoringMixin.
        skill_offset:
          type: number
          description: |
            `GetPlayerSkillOffset()`: marines play at `skill + skill_offset`,
            aliens at `skill - skill_offset`.
        comm_skill:
          type: number
          description: "`GetCommanderSkill()`: commander skill."
        comm_skill_offset:
          type: number
          description: "`GetCommanderSkillOffset()`, applied to `comm_skill` the same way."
        skill_tier:
          type: integer
          minimum: -2
          maximum: 7
          description: |
            `GetSkillTier()`: the scoreboard's skill badge. `-1` a bot, `-2`
            no skill, `0` a rookie, else 1-7. Not team-relative. Absent with
            `skill`, or when the call errors.

    ServerState:
      type: object
      description: "`GetServerState()`."
      required:
        [cheats, devmode, map, players_online, marines, aliens, uptime,
         player_list, marine_res, alien_res, server_name, frame_rate,
         game_started, game_time, max_players]
      properties:
        cheats: { type: boolean }
        devmode: { type: boolean }
        map: { type: string, examples: [ns2_summit] }
        players_online:
          type: integer
          description: Player entities, so a player being kicked can still count.
        marines: { type: integer }
        aliens: { type: integer }
        uptime: { type: integer, description: "Seconds since the map loaded." }
        player_list:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        marine_res: { type: number }
        alien_res: { type: number }
        server_name: { type: string }
        frame_rate: { type: number, description: "Current server tickrate." }
        game_started: { type: boolean }
        game_time:
          type: integer
          description: Seconds since round start, `0` when no round is running.
        max_players:
          type: integer
          description: |
            `Server.GetMaxPlayers()`. `sv_reserved_slots` ignores a value
            above it.
          examples: [16]
        map_loaded_at:
          type: integer
          description: Unix seconds when the map loaded; `getperf`'s `loaded_at`.
          examples: [1791403505]
        ranking_active:
          type: boolean
          description: |
            `Server.GetIsRankingActive()`. On when the server is not hidden,
            is dedicated, has no cheats or Lua hot reloading, has at most 5
            spectator slots and 12 to 20 player slots, and every mounted mod
            is whitelisted.
          examples: [false]
        shine:
          $ref: "#/components/schemas/ShineState"

    ShineState:
      type: object
      description: |
        Only when Shine is loaded: which of its plugins that replace vanilla
        behaviour are on, read per request.

        - `ban`: Shine owns the ban list. Ban with `sh_banid`, unban with
          `sh_unban`; an `sv_ban` of an absent id is not enforced.
        - `reservedslots`: Shine sets the slot count and grants slots by
          permission; the vanilla list is not enforced.
        - `mapvote`: Shine picks the next map.
        - `basecommands`: `sh_gag` and `sh_ungag` exist (the game has no
          mute), and each player carries `gagged`.
      required: [ban, reservedslots, mapvote, basecommands]
      properties:
        ban: { type: boolean }
        reservedslots: { type: boolean }
        mapvote: { type: boolean }
        basecommands: { type: boolean }
      examples:
        - { ban: true, reservedslots: false, mapvote: true, basecommands: true }

    BanEntry:
      type: object
      description: One ban in force. Shine adds `issued` and `banned_by`.
      required: [id, name, reason, permanent]
      properties:
        id: { $ref: "#/components/schemas/SteamId" }
        name:
          type: string
          description: |
            `Unknown` (vanilla) or `<unknown>` (Shine) for an id banned while
            not connected. Under Shine, the name the recent-players list has
            for it, when it has one.
        reason:
          type: string
          description: '`None provided` (vanilla) or `No reason given.` (Shine) when none was given.'
        permanent:
          type: boolean
          description: An expiry of `0`, or more than 100 years away.
        expires:
          type: integer
          description: Unix seconds. Absent when `permanent`.
        issued: { type: integer, description: "Shine only. Unix seconds." }
        banned_by:
          type: string
          description: Shine only. `Console` when banned from the web admin or the console.

    BanList:
      type: object
      required: [source, now, bans]
      properties:
        source:
          type: string
          enum: [vanilla, shine]
          description: Which ban list was read.
        now:
          type: integer
          description: The server's clock, in unix seconds.
        bans:
          type: array
          description: |
            Newest first: Shine's by `issued`, vanilla's in reverse file
            order.
          items: { $ref: "#/components/schemas/BanEntry" }

    RecentPlayer:
      type: object
      description: One player seen recently.
      required:
        [steamid, name, names, ipaddress, first_seen, last_seen, played, connected]
      properties:
        steamid: { $ref: "#/components/schemas/SteamId" }
        name: { type: string, description: "The name last seen. Empty until there is one." }
        names:
          type: array
          description: Former names, newest first, at most 5.
          items: { type: string }
        ipaddress:
          type: string
          description: |
            The full IP address at their last connection. Empty when the
            engine gave none.
          examples: ["0.0.0.0"]
        first_seen: { type: integer, description: "Unix seconds, within the window." }
        last_seen: { type: integer, description: "Unix seconds. `now` while connected." }
        played:
          type: number
          description: Seconds connected within the window, over all sessions.
        connected: { type: boolean }

    RecentPlayers:
      type: object
      required: [now, window, capacity, storage, players]
      properties:
        now:
          type: integer
          description: The server's clock, in unix seconds.
        window:
          type: integer
          description: How far back the list reaches, in seconds (86400).
        capacity:
          type: integer
          description: At most this many players are kept (100); the oldest go first.
        storage:
          type: object
          required: [loaded]
          properties:
            loaded:
              type: string
              enum: [ok, empty, unreadable]
              description: |
                How the file loaded at map load. `empty`: no file yet.
                `unreadable`: the file was torn, so the list started empty.
            error:
              type: string
              description: |
                Why the last save failed. Absent while saves work. When
                present, the list will not survive the next map change.
        players:
          type: array
          description: Most recently seen first.
          items: { $ref: "#/components/schemas/RecentPlayer" }

    ReservedSlotEntry:
      type: object
      required: [name, id]
      properties:
        name: { type: string, description: '`"None"` when added without one.' }
        id: { $ref: "#/components/schemas/SteamId" }

    ReservedSlots:
      type: object
      description: |
        `GetReservedSlotData()`. `{}` when the server has no reserved-slot
        config. Slots are keyed by name: adding one under a name already
        present replaces it.
      properties:
        amount: { type: integer, minimum: 0 }
        ids:
          type: array
          items: { $ref: "#/components/schemas/ReservedSlotEntry" }
        shine:
          type: object
          description: |
            Only while Shine's reservedslots plugin is on. Shine then sets the
            count (`sh_setresslots`) and grants slots by permission, so
            `amount` and `ids` are not enforced.
          required: [slots]
          properties:
            slots: { type: integer, minimum: 0 }

    ChatEntry:
      type: object
      description: One chat entry.
      required: [id, time, message, player, steamId, team, teamOnly]
      additionalProperties: false
      properties:
        id: { type: integer, description: "Increasing within a map, from 1." }
        time: { type: integer, description: "Unix seconds." }
        message: { type: string }
        player: { type: string, description: "`Admin` for sv_say and sv_tsay." }
        steamId: { $ref: "#/components/schemas/SteamId" }
        team:
          allOf: [{ $ref: "#/components/schemas/TeamNumber" }]
          description: The team it was said to; 0 for sv_say.
        teamOnly: { type: boolean }

    ChatStream:
      type: object
      description: A page of the chat history.
      required: [entries, last_id, dropped, buffer_size]
      additionalProperties: false
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ChatEntry" }
        last_id: { type: integer, description: "Pass as `since` on the next poll." }
        dropped:
          type: integer
          description: Entries that left the history before being read, this map.
        buffer_size: { type: integer, description: "History capacity, 200." }

    PerfReport:
      type: object
      required: [window_s, capacity, loaded_at, map, windows, last_id]
      properties:
        window_s: { type: integer, description: Seconds of engine samples per window. }
        capacity: { type: integer, description: Windows kept; the oldest is dropped. }
        loaded_at:
          type: integer
          description: Unix seconds when the map loaded. A change means the ids restarted.
        map: { type: string }
        config:
          type: object
          description: |
            The rates the server runs at, from the engine's latest sample.
            Absent until the first sample after a map load.
          required: [tickrate, moverate, sendrate, interp_ms, max_players]
          properties:
            tickrate: { type: integer }
            moverate: { type: integer }
            sendrate: { type: integer }
            interp_ms: { type: integer }
            max_players: { type: integer }
            bw_limit:
              type: integer
              description: "`Server.GetBwLimit()`: bytes a second per player."
        windows:
          type: array
          items: { $ref: "#/components/schemas/PerfWindow" }
        last_id:
          type: integer
          description: |
            The last window in this reply when `more`, else the newest
            window's id; 0 before the first. Poll again with `since=<last_id>`.
        more:
          type: boolean
          description: More windows are held past `last_id`; ask again at once.
        engine: { $ref: "#/components/schemas/PerfEngine" }

    PerfEngine:
      type: object
      description: |
        The engine's reports: tickstat windows from `Server.GetTickStat()`,
        timed when the window closed, and log lines, timed by the scan that
        found them. One id sequence across all three lists.
      required: [scan_s, last_id, now, tickstats, perfmon, events]
      properties:
        now: { type: integer, description: "The server's clock, in unix seconds." }
        scan_s: { type: integer, description: Seconds between scans of the log. }
        last_id:
          type: integer
          description: |
            Poll again with `esince=<last_id>`. The last record in this reply
            when `more`, else the newest.
        more:
          type: boolean
          description: More records are held past `last_id`; ask again at once.
        tickstat_last_at:
          type: integer
          description: When the newest tickstat window closed. Absent when none has since the map load.
        tickstat_said:
          type: object
          description: "The last `tickstat: on|off` the command printed since the map load."
          required: [text, time]
          properties:
            text: { type: string }
            time: { type: integer }
        tickstats:
          type: array
          items: { $ref: "#/components/schemas/Tickstat" }
        perfmon:
          type: array
          items: { $ref: "#/components/schemas/PerfmonBlock" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EngineEvent" }

    Tickstat:
      type: object
      description: |
        One window of `Server.GetTickStat()`, with any fields the engine
        adds. `time`: when it closed, unix seconds.
      required: [id, time]
      properties:
        id: { type: integer }
        time: { type: integer }
        window: { type: number, description: Seconds the window covers. }
        hz: { type: number, description: Ticks delivered per second. }
        target: { type: integer, description: The configured tickrate. }
        intervalP50: { type: number, description: Tick spacing, median, ms. }
        intervalP99: { type: number }
        intervalP999: { type: number }
        intervalMax: { type: number }
        latenessMax: { type: number }
        rearms: { type: integer }
        stretchPct: { type: number, description: Share of ticks the server stretched. }
        governorMax: { type: integer }
        incomplete: { type: integer }
        loops: { type: integer }
        incompleteLate: { type: integer }
        incompleteWriters: { type: integer }
        incompleteMoves: { type: integer }
        waitOverP99: { type: number }
        waitOverMax: { type: number }
        waits: { type: integer }
        busyPct: { type: number }
        humans: { type: integer }
        bots: { type: integer }
        snapPerSecPerHuman: { type: number }
        bytesPerSecPerHuman: { type: number }
        movesPerSecPerHuman: { type: number }
        movesPerSecPerBot: { type: number }
        injectedPct: { type: number }
        moveMsPerTick: { type: number }
        specMovesPerSec: { type: number }
        specMoveMsPerTick: { type: number }
        snapBytesP50: { type: number }
        snapBytesP99: { type: number }
        snapBytesMax: { type: integer }
        chokedPct: { type: number, description: Share of updates held back by bwlimit. }
        humanMoveMsPerTick: { type: number }
        sendBufDrops: { type: integer }
        rateStepped: { type: integer, description: Players whose update rate was lowered. }
        slowestSendrate: { type: number, description: The lowest update rate a player was at. }
        creationsDeferred: { type: integer }

    PerfmonBlock:
      type: object
      description: The engine's `perfmon:` block, printed when `perfmon` is run. Covers the last second.
      required: [id, time]
      properties:
        id: { type: integer }
        time: { type: integer }
        jitter_avg_ms: { type: number }
        jitter_max_ms: { type: number }
        jitter_n: { type: integer }
        snapshot_write_avg_ms: { type: number }
        snapshot_write_max_ms: { type: number }
        snapshot_write_n: { type: integer }
        entities_skipped: { type: integer }
        entities_total: { type: integer }
        entities_skipped_pct: { type: number }
        rejected_time_credit: { type: integer }
        rejected_other: { type: integer }
        rewound_missing: { type: integer }
        score: { type: integer }
        idle_pct: { type: number }
        delivery_pct: { type: number }
        overload_pct: { type: number }
        updates: { type: integer }
        warn: { type: integer }
        fail: { type: integer }

    EngineEvent:
      oneOf:
        - type: object
          description: "`client N: snapshot rate A -> B/s (...)`: a player's update rate stepped."
          required: [id, time, kind, client, from_rate, to_rate, choked_pct, clear_ms, bwlimit]
          properties:
            id: { type: integer }
            time: { type: integer }
            kind: { const: rate }
            client: { type: integer, description: A slot number, not an identity. }
            from_rate: { type: number }
            to_rate: { type: number }
            choked_pct: { type: number }
            clear_ms: { type: number }
            bwlimit: { type: integer }
        - type: object
          description: The engine's warning that bwlimit leaves too few bytes per snapshot.
          required: [id, time, kind, bwlimit, sendrate, per_snapshot, needed, suggested]
          properties:
            id: { type: integer }
            time: { type: integer }
            kind: { const: bwlimit_low }
            bwlimit: { type: integer }
            sendrate: { type: integer }
            per_snapshot: { type: integer }
            needed: { type: integer }
            suggested: { type: integer, description: The bwlimit the engine suggests. }

    PerfWindow:
      type: object
      required: [id, time, tickrate, worst_tick_ms, players, score, idle_pct,
                 moves_pct, entities_pct, entities, interp_warns, interp_fails,
                 lua_kb]
      properties:
        id: { type: integer }
        time: { type: integer, description: "Unix seconds when the window closed." }
        tickrate: { type: number, description: "`UpdateServer` calls a second over the window." }
        worst_tick_ms: { type: number, description: The longest single tick. }
        players: { type: integer }
        score:
          type: integer
          description: |
            The engine's performance score, -99 to 100, higher is better;
            perfmon shows green from 10, yellow from 0, orange from -10, red
            below. 0 on an empty server.
        idle_pct: { type: number }
        moves_pct: { type: number, description: Share of the window spent on player moves. }
        entities_pct: { type: number, description: Share spent updating other entities. }
        entities: { type: integer, description: Average entity count. }
        interp_warns:
          type: integer
          description: Late updates to a player (interval > 0.75 x interp).
        interp_fails:
          type: integer
          description: Updates at or past interp.
        lua_kb: { type: integer, description: "The Lua heap, `collectgarbage(\"count\")`." }

    InstalledMod:
      type: object
      required: [id, name, active, whitelisted]
      properties:
        id: { $ref: "#/components/schemas/ModId" }
        name:
          type: string
          description: |
            The workshop title, or the decimal workshop id when the server
            has no details of the mod.
        active:
          type: boolean
          description: |
            Mounted now: the cycle's `mods`, the map's own `mods`, and the
            hotfix mods the engine mounts itself. Changes only at a map
            change.
        whitelisted:
          type: boolean
          description: |
            `Server.GetIsModWhitelisted`: on the ranked-mod whitelist read at
            boot. False for every mod if the list could not be read.

    MapListEntry:
      type: object
      required: [name, modId]
      properties:
        name: { type: string, examples: [ns2_summit] }
        modId:
          allOf: [{ $ref: "#/components/schemas/ModId" }]
          description: '`"0"` for a stock map, otherwise the mod that provides it.'

    MapCycleEntry:
      description: A map name, or an object naming the mods that map needs.
      oneOf:
        - type: string
          examples: [ns2_summit]
        - type: object
          required: [map]
          description: |
            Other keys (Shine's mapvote `min`, `max`, `chance`, `percent`,
            `time`, `rounds`, ...) pass through.
          additionalProperties: true
          properties:
            map: { type: string }
            mods:
              type: array
              items: { $ref: "#/components/schemas/ModId" }

    MapCycle:
      type: object
      description: |
        `config://MapCycle.json`, mod ids hex-encoded; a string containing
        `:` is left as it is. Other keys (Shine's mapvote `groups`) pass
        through.
      additionalProperties: true
      properties:
        maps:
          type: array
          items: { $ref: "#/components/schemas/MapCycleEntry" }
        time:
          type: number
          description: Minutes before the cycle advances.
        mode:
          type: string
          description: "`order` plays the list in sequence; `random` shuffles."
          examples: [order, random]
        mods:
          type: array
          description: Mods mounted for the whole cycle.
          items: { $ref: "#/components/schemas/ModId" }
        groups:
          type: array
          description: Shine's mapvote map groups.

    MapCycleWrite:
      description: The answer to `setmapcycle`.
      oneOf:
        - type: object
          required: [ok, cycle]
          additionalProperties: false
          properties:
            ok: { const: true }
            cycle:
              allOf: [{ $ref: "#/components/schemas/MapCycle" }]
              description: The file read back after the write.
        - type: object
          required: [ok, error]
          additionalProperties: false
          properties:
            ok: { const: false }
            error:
              type: string
              description: 'Why nothing was written, e.g. `mods[1] is not a hex mod id: zzzz`.'

    MapVote:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maps_from_cycle: { type: boolean }
        round_limit: { type: integer, minimum: 0 }
        next_map: { type: string }
        options:
          type: array
          items: { type: string }

    WorkshopItem:
      type: object
      description: One workshop search hit.
      required:
        [id, title, description, authorid, filesize, tags, steamresult,
         childcount, thumbnailurl, version]
      properties:
        id:
          allOf: [{ $ref: "#/components/schemas/ModId" }]
          description: Feed it to `installmod`.
        title: { type: string }
        description: { type: string, description: "Steam BBCode, not HTML." }
        authorid:
          type: string
          description: The author's SteamID64, as a string.
          examples: ["76561197980112344"]
        filesize: { type: integer, description: "Bytes." }
        tags: { type: string, description: "Comma-separated, possibly empty." }
        steamresult: { type: integer, description: "Steam's result code; `1` is OK." }
        childcount: { type: integer }
        thumbnailurl:
          type: string
          format: uri
          description: An HTTPS URL on `images.steamusercontent.com`.
        version: { type: integer, description: "Unix seconds of the item's last update." }
        whitelisted:
          type: boolean
          description: On the ranked-mod whitelist, as for `InstalledMod`.

    ConsoleLine:
      type: object
      description: One captured line.
      required: [id, time, src, text]
      properties:
        id: { type: integer, description: "The line's place in the reply, from 1." }
        time: { type: integer, description: "Unix seconds." }
        src:
          type: string
          enum: [audit, server]
          description: |
            `audit`: the receipt the game prints before an admin command.
            `server`: anything else.
        text: { type: string }

    CommandResult:
      type: object
      description: The result of `runCommand`.
      required: [cmd, dispatched, lines]
      properties:
        cmd: { type: string, description: "The command line as sent." }
        dispatched:
          type: boolean
          description: |
            An admin command ran. `false`: a plain console command, or no
            such command.
        lines:
          type: array
          description: What it printed. Empty is not failure.
          items: { $ref: "#/components/schemas/ConsoleLine" }

    LogLine:
      type: object
      description: One line of the log, without its newline.
      # Quoted: YAML 1.1 reads a bare `off` as the boolean false.
      required: ["off", text]
      additionalProperties: false
      properties:
        "off":
          type: integer
          minimum: 0
          description: Byte offset of the line in the file, unique within it.
        text:
          type: string
          description: |
            Verbatim, without a trailing CR. Bytes that are not UTF-8 are
            passed as they are.

    LogPage:
      type: object
      description: A stretch of `log-Server.txt`.
      required: [file_id, size, from, to, lines, more, at_start]
      additionalProperties: false
      properties:
        file_id:
          type: string
          description: |
            The header's Date and Time, e.g. `09/28/2026 02:50:11 AM`; empty
            for a file without the header. Pass back as `file`.
        size: { type: integer, minimum: 0, description: "The file's size now, in bytes." }
        from: { type: integer, minimum: 0, description: "Offset of the first byte served." }
        to:
          type: integer
          minimum: 0
          description: |
            Offset after the last complete line served: the next `since`.
            Below `size` when a line is still being written or `more` is set.
        lines:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        more: { type: boolean, description: "Stopped at 64 KB; ask again at once." }
        at_start: { type: boolean, description: "`from` is 0: nothing earlier to page to." }
        reset:
          type: string
          enum: [new_file, truncated]
          description: The cursor did not fit this file; this reply is a fresh tail.

    WorkshopSearchResult:
      description: |
        Loading or settled. No matches and a failed search look the same; a
        search with no answer after 30 s settles with `error`.
      oneOf:
        - type: object
          title: Loading
          required: [loading, elapsed]
          additionalProperties: false
          properties:
            loading: { type: boolean, const: true }
            elapsed:
              type: number
              description: Seconds since this search started.
        - type: object
          title: Settled
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 50
              description: At most 50. Empty for no matches and for a failed search.
              items: { $ref: "#/components/schemas/WorkshopItem" }
            capped:
              type: boolean
              description: |
                50 hits: the search may have found more. Absent with `error`.
            error:
              type: string
              description: |
                The search had no answer after 30 s. Reported once; the next
                request starts a new search.

    InstallModResult:
      description: The answer to `installmod`.
      oneOf:
        - type: object
          required: [ok, id, already_installed]
          additionalProperties: false
          properties:
            ok: { const: true }
            id:
              allOf: [{ $ref: "#/components/schemas/ModId" }]
              description: The id as sent to `Server.InstallMod`, lower case, no leading zeros.
            already_installed:
              type: boolean
              description: It was installed already; the engine checks it for an update.
        - type: object
          required: [ok, error]
          additionalProperties: false
          properties:
            ok: { const: false }
            error:
              type: string
              description: 'Why nothing was sent to the engine, e.g. `Not a hex workshop id: zz`.'
