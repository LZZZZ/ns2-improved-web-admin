        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getmapvote":
    get:
      tags: [mod, maps]
      operationId: getMapVote
      x-request: getmapvote
      x-requires-mod: true
      summary: What Shine's mapvote will do with the map cycle
      description: |
        **Mod only.** `enabled: false` and nothing else when Shine's mapvote
        plugin is not on. When it is:

        - `maps_from_cycle`: the vote takes its options from the cycle
          (`GetMapsFromMapCycle`). Otherwise it uses its own map list and the
          cycle's maps are not what players vote on.
        - `options`: the maps the vote offers **now**. The plugin reads the
          cycle once, at map load, so after a `setmapcycle` this lags the
          file until the next map (measured, CONSTRAINTS item 13).
        - `round_limit`: rounds before the map ends, `0` for none. When set,
          it ends the map instead of the cycle's `time`, and `mode` plays no
          part either way.
        - `next_map`: `Plugin:GetNextMap()`, the vote's winner if there is
          one, else the next option after the current map. Absent when the
          plugin could not say.

        `getmapvote-off.json` is synthetic (`{"enabled": false}`); the Shine
        one is the rig's, on a Shine config.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The mapvote plugin's view of the cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVote" }
          x-fixtures:
            - getmapvote-off.json
            - getmapvote-shine.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  "/#request=getwhitelist":
    get:
      tags: [mod]
      operationId: getWhitelist
      x-request: getwhitelist
      x-requires-mod: true
      summary: The ranked-mod whitelist, as the server last read it from Steam
      description: |
        **Mod only.** A mod not on the whitelist turns ranking off. The engine
        reads the list at boot, as the "Required items" of an unlisted Workshop
        item, and gives Lua no way to see it, so the mod reads the item's
        public page itself (CONSTRAINTS.md item 17). Ids are **decimal** workshop ids, as
        Steam spells them, not the hex the rest of the API uses.

        - The first request with no copy, or a copy more than an hour old,
          starts a read and answers `fetching: true`; the read takes about
          2 s (two pages, one after the other). A copy is kept in
          `config://webadmin-spa/whitelist.json`, so a map change does not
          read Steam again.
        - `whitelist`, `hotfix` and `read_at` are present together, when there
          is a copy. `hotfix` are the hotfix mods, which the engine never
          checks: they count as whitelisted.
        - `error` says why the last read failed (Steam unreachable, an HTTP
          status, a page with no list). The mod then waits 5 minutes before
          reading again, and keeps serving any older copy meanwhile. With no
          known whitelist for the server's hotfix list, `branch` is absent
          and so is everything but `now` and `error`.
        - `hotfix_list_id` is what `ModServices.GetHotfixListModId()` returns:
          2633436686 on the live branch, 2708090797 on beta.

        `getwhitelist-fetching.json` and `getwhitelist-rig.json` are the rig's
        first and second answer (2026-10-08). `getwhitelist-failed.json` is
        synthetic, with curl's message for an unknown host as the rig's probe
        recorded it.
      parameters:
        - $ref: "#/components/parameters/RequestConst"
      responses:
        "200":
          description: The whitelist, or that it is being read, or why not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whitelist" }
          x-fixtures:
            - getwhitelist-fetching.json
            - getwhitelist-rig.json
            - getwhitelist-failed.json
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

  # ---------------------------------------------------------------- static

  /index.html:
    get:
      tags: [static]
      operationId: getPanel
      summary: The admin panel itself
      description: |
        `Shared.SetWebRoot("web")` (`ServerWebInterface.lua:25`) serves
        `ns2/web/` -- or a mod's `web/`, which shadows it. Files under the
        root are returned with a guessed content type (`.js` as the obsolete
        `application/x-javascript`).

        `/index.html` is documented in `Dedicated_Server_Usage.txt:118`, but
        the server's own boot line is `Web server running at <host>:<port>`
        with no path -- and a bare `/` is not a directory index, it is the
        server-state blob. Anything not on disk falls through to the JSON
        handler with `200`, so **a missing asset never looks like a 404**.
      responses:
        "200":
          description: The panel.
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/ForeignOrigin" }
        "503": { $ref: "#/components/responses/Busy" }

components:

  securitySchemes:
    digestAuth:
      type: http
      scheme: digest
      description: |
        HTTP Digest, MD5, handled by the engine (`ComputePasswordDigest` in
        `server_linux`), never by Lua. The realm is the `-webdomain` value, or
        `localhost` when unset. Credentials come from `-webuser` / `-webpassword`.

        Measured on the 26-09-03 build:

        - A nonce is **reusable** for its lifetime as long as the client
          increments `nc` -- ordinary RFC 7616 behaviour.
        - Replaying an already-used `nc` is refused `401` with `stale="true"`.
        - The nonce expires on **age, not idleness**: polled every 2 s, one
          nonce took 150 requests and was refused at **301 s**, `nc` having
          reached `00000097`. The refusal carries a fresh nonce, and the next
          request signed with it returns `200`.
        - 10 failed logins per address per minute earns a **1 minute
          lockout** -- back off on `401`, never retry-loop bad credentials.

        A browser absorbs all of this. Verified in headless Chrome: a
        `fetch()` poll left running 480 s at a 2 s cadence made 240 requests,
        all `200`, across a nonce expiry, with no prompt and no `401` visible
        to DevTools. **A polling panel needs no re-authentication logic of its
        own.**

        Still plain HTTP.

  parameters:
    RequestConst:
      name: request
      in: query
      required: true
      description: The action selector. Pinned to this operation's value.
      schema: { type: string }
    RequestJson:
      name: request
      in: query
      required: false
      description: |
        Any value that is not one of the eleven recognised actions, or no value at
        all, reaches the default handler. The panel sends `json` by convention.
      schema: { type: string, default: json }

  responses:
    EmptyWrite:
      description: |
        Accepted. Lua returns nothing for a write, so the engine sends an empty
        `200` whose `Content-Type` is `text/html` -- not JSON. There is no
        success flag, no error and no body to parse; the only way to confirm a
        write is to read the state back.
      content:
        text/html:
          schema: { type: string, const: "" }
      headers:
        Content-Length: { schema: { type: integer, const: 0 } }

    DigestChallenge:
      description: |
        Digest challenge. `stale="true"` means the credentials were fine and
        only the nonce was old -- a browser retries silently. Repeated genuine
        failures trigger a one-minute per-address lockout after 10 in a minute.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: Digest qop="auth", realm="127.0.0.1", nonce="…", stale="true"

    ForeignOrigin:
      description: |
        Refused: the request carried an `Origin` header that does not match
        `Host`. Compared against the `Host` header, not against `-webdomain`.
        `Origin: null` is refused too; a request with no `Origin` at all is
        accepted. **This is why a Vite dev server on `:5173` cannot talk to a
        real game server** -- develop against `mock/server.js`.

        With **no login configured** (09-25 and later), a `Host` that is
        neither `localhost` nor an IP literal is refused `403` as well,
        static files included. See CONSTRAINTS.md, "The Host rule".

    BodyTooLarge:
      description: |
        Request body over the 64 KB cap, or a malformed `Content-Length`. The
        cap is measured; this exact status is not -- an over-cap body was never
        captured from a real server. Treat it as a refusal either way.

    Busy:
      description: |
        The request gave up after 30 s. This is the shape of a busy server, not
        a hard failure -- retry with backoff rather than surfacing an error.

  schemas:

    SteamId:
      type: integer
      description: |
        Steam id as the engine reports it (`client:GetUserId()`). `0` for bots.
        A number here, unlike mod ids, which are hex strings.
      examples: [10000000, 0]

    ModId:
      type: string
      pattern: "^[0-9a-f]+$"
      description: |
        A workshop id, lowercase hex, no `0x` prefix. JSON has no 64-bit
        integers, so the server converts with `string.format("%x", id)` on the
        way out and `tonumber64("0x"..mod)` on the way back in. **Round-trip it
        as a string; never parse it as a number.** `1e62a2ce` is workshop item
        `509780686`. `"0"` means "no mod" in `getmaplist`.
      examples: ["1e62a2ce", "0"]

    TeamNumber:
      type: integer
      description: |
        `0` ready room, `1` marines, `2` aliens, `3` spectators
        (`Globals.lua:119-122`).
      enum: [0, 1, 2, 3]

    StringBool:
      type: string
      enum: ["true", "false"]
      description: |
        A boolean that crossed the wire as a string, via `tostring()`. Compare
        against `"true"`, never for truthiness -- `"false"` is truthy in JS.

    WireBool:
      description: |
        A stock server sends a `StringBool` (`tostring()`); the mod's Lua
        sends a real boolean (CONSTRAINTS item 4). A client reading both
        compares against `true` and `"true"`, never for truthiness.
      oneOf:
        - { type: boolean }
        - { $ref: "#/components/schemas/StringBool" }

    Player:
      type: object
      description: One connected player, from `GetServerState()`, lines 90-104.
      required:
        [name, steamid, isbot, team, iscomm, score, kills, assists, deaths,
         resources, ping, ipaddress]
      properties:
        name: { type: string }
        steamid: { $ref: "#/components/schemas/SteamId" }
        isbot:
          allOf: [{ $ref: "#/components/schemas/WireBool" }]
          description: |
            Stock: `tostring(client:GetIsVirtual())` -- a **string**, while
            `iscomm` beside it is a real boolean. The mod sends a boolean.
        team: { $ref: "#/components/schemas/TeamNumber" }
        iscomm: { type: boolean, description: "A real boolean, unlike stock's `isbot`." }
        score: { type: integer }
        kills: { type: integer }
        assists: { type: integer }
        deaths: { type: integer }
        resources: { type: number }
        ping: { type: integer }
        ipaddress:
          type: string
          description: |
            **The player's full IP address**, served over plain HTTP to anyone
            who can authenticate. Mask by default and reveal per row on
            request. Live captures must never be committed -- the fixtures in
            this repo are redacted to `0.0.0.0`.
          examples: ["0.0.0.0"]
        gagged:
          type: boolean
          description: |
            **Mod only, under Shine's basecommands plugin**: muted with
            `sh_gag`, read through the plugin's `IsClientGagged`, which also
            expires a timed gag. Absent otherwise.
        familyshared:
          type: boolean
          description: |
            **Mod only, on the 09-26+ beta engine**
            (`Server.GetIsFamilyShared`): playing a Steam Family Shared copy.
            Bots, the listen host and LAN players always read false (the
            engine's CHANGELOG). Absent on an engine without the function,
            or when it errors.
        owner_steamid:
          allOf: [{ $ref: "#/components/schemas/SteamId" }]
          description: |
            **Mod only, beta engine**, and only with `familyshared: true`:
            `Server.GetOwnerUserId`, the account that owns the game.
        moves_rejected_time:
          type: number
          description: |
            **Mod only, beta engine**
            (`ServerClient:GetMovesRejectedTimeCredit`): moves rejected for
            time credit, "usually a modified client" (CHANGELOG). Measured
            2026-10-06: an unmodified 09-28 client on the 09-27 rig, idle and
            minimized most of the time, climbed about 6/s, dropped once (75
            to 45) and restarted at a map change -- not a monotonic count,
            and not rare.
        moves_rejected_other:
          type: number
          description: |
            **Mod only, beta engine** (`ServerClient:GetMovesRejectedOther`):
            moves rejected for anything else; "a poor connection can also
            cause these" (CHANGELOG).
        skill:
          type: number
          description: |
            **Mod only.** `ScoringMixin:GetPlayerSkill()`: the Hive skill the
            server ranks and balances with (under UWE Hotfix 344, read from
            Steam User Stats). Absent for a player without ScoringMixin.
            `-1`, with all three below, when the server holds none: every
            bot, on the rig. Matched what Steam User Stats holds for a human
            on the rig (2026-10-07).
        skill_offset:
          type: number
          description: |
            **Mod only.** `GetPlayerSkillOffset()`: marines play at `skill +
            skill_offset`, aliens at `skill - skill_offset`.
        comm_skill:
          type: number
          description: "**Mod only.** `GetCommanderSkill()`: commander skill."
        comm_skill_offset:
          type: number
          description: |
            **Mod only.** `GetCommanderSkillOffset()`, applied to `comm_skill`
            the same way.
        skill_tier:
          type: integer
          minimum: -2
          maximum: 7
          description: |
            **Mod only.** `ScoringMixin:GetSkillTier()`: the tier the game
            draws the scoreboard's skill badge for. `-1` a bot, `-2` no
            skill, `0` a rookie (level 10 or below), else 1-7 from `skill`
            less `25 / sqrt(adagrad sum)`, the server's uncertainty, banded
            at 300, 750, 1400, 2100, 2900 and 4100 (`GetPlayerSkillTier`).
            Not team-relative, unlike the scoreboard's own badge. The game
            keeps its first answer for the rest of the map; the mod puts back
            whatever was kept, so asking changes nothing. Absent with `skill`,
            or when `GetSkillTier()` errors.

    ServerState:
      type: object
      description: |
        `GetServerState()`, `ServerWebInterface.lua:78-135`. Also the response
        to every unrecognised request, to a console command, and to any path
        that is not a file on disk.
      required:
        [webdomain, webport, cheats, devmode, map, players_online, marines,
         aliens, uptime, player_list, marine_res, alien_res, server_name,
         frame_rate, game_started, game_time]
      properties:
        webdomain:
          type: string
          description: Substituted by the engine from `[[webdomain]]`.
        webport:
          type: string
          description: Substituted from `[[webport]]`. A **string**.
          examples: ["8080"]
        cheats: { $ref: "#/components/schemas/WireBool" }
        devmode: { $ref: "#/components/schemas/WireBool" }
        map: { type: string, examples: [ns2_summit] }
        players_online:
          type: integer
          description: |
            Player entity count. Rendered before a disconnect completes, so a
            successful kick can still be reflected here -- verified: a kick
            that worked still reported 12.
        marines: { type: integer }
        aliens: { type: integer }
        uptime: { type: integer, description: "Seconds, `math.floor(Shared.GetTime())`." }
        player_list:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        marine_res: { type: number }
        alien_res: { type: number }
        server_name: { type: string }
        frame_rate: { type: number, description: "Current server tickrate." }
        game_started: { type: boolean, description: "A real boolean." }
        game_time:
          type: integer
          description: Seconds since round start, `0` when no round is running.
        mod_version:
          type: string
          description: |
            **Mod only.** The version of the webadmin-spa Lua serving this
            request. Absent on a stock server, which is the supported way to
            tell the two apart -- a panel should read this once and say plainly
            what is unavailable rather than offering features that cannot work.
          examples: ["0.1.0"]
        max_players:
          type: integer
          description: |
            **Mod only.** `Server.GetMaxPlayers()`. The reserved slot amount
            must not exceed it: `sv_reserved_slots` silently ignores a larger
            value.
          examples: [16]
        map_loaded_at:
          type: integer
          description: |
            **Mod only.** When the current map loaded, Unix seconds
            (`Shared.GetSystemTime()` as the Lua VM starts, the same stamp
            as `getperf`'s `loaded_at`). The VM is rebuilt at every map
            change, so it is the last map change's time, from the server
            rather than from whenever a panel noticed.
          examples: [1791403505]
        ranking_active:
          type: boolean
          description: |
            **Mod only.** `Server.GetIsRankingActive()`: whether the engine
            counts this server's rounds for ranking. It turns ranking on by
            itself when the server is not hidden, is dedicated, has no cheats
            or Lua hot reloading, has at most 5 spectator slots and 12 to 20
            player slots, and every mounted mod is whitelisted (CONSTRAINTS
            item 18). So it should be `false` wherever this mod is mounted
            until the mod is whitelisted. Absent when the call is missing or
            errors.
          examples: [false]
        shine:
          $ref: "#/components/schemas/ShineState"

    ShineState:
      type: object
      description: |
        **Mod only, and only when Shine is loaded** -- the key is absent
        otherwise. Whether each Shine plugin that replaces vanilla behaviour
        is enabled, read per request with `Shine:IsExtensionEnabled`, so a
        plugin loaded or unloaded at runtime shows up at once.

        - `ban`: Shine owns the ban list and redirects `sv_ban`/`sv_unban`.
          Ban with `sh_banid`, unban with `sh_unban`: an `sv_ban` of an id
          that is not connected reports success but lands only in the
          vanilla list, which is not enforced (measured 2026-09-27).
        - `reservedslots`: Shine sets the reserved slot count and grants
          access by the `sh_reservedslot` permission; the vanilla id list is
          not what is enforced.
        - `mapvote`: Shine decides the next map.
        - `basecommands` *(2026-10-06; absent from older mods)*: Shine's
          `sh_gag`/`sh_ungag` exist, the only mute there is -- the game has
          no mute command, and the 2012 panel's `sv_mute` never existed
          (CURRENT-UI defect 18). Each player then carries `gagged`.
      required: [ban, reservedslots, mapvote]
      properties:
        ban: { type: boolean }
        reservedslots: { type: boolean }
        mapvote: { type: boolean }
        basecommands: { type: boolean }
      examples:
        - { ban: true, reservedslots: false, mapvote: true, basecommands: true }

    BanEntry:
      type: object
      description: |
        One ban in force, as `getbans` reports it: the same record whether
        vanilla or Shine owns the list, with Shine's extra fields when it
        does.
      required: [id, name, reason, permanent]
      properties:
        id: { $ref: "#/components/schemas/SteamId" }
        name:
          type: string
          description: |
            `Unknown` (vanilla) or `<unknown>` (Shine) when the id was banned
            while not connected. Under Shine with the mod, such a ban is
            stored under the name the recent-players list last saw, when the
            player is in it.
        reason:
          type: string
          description: '`None provided` (vanilla) or `No reason given.` (Shine) when none was given.'
        permanent:
          type: boolean
          description: |
            True for an expiry of `0`, **and** for one more than 100 years
            away -- Shine stores `6e+24` for some permanent bans.
        expires:
          type: integer
          description: Unix seconds. Absent when `permanent`.
        issued: { type: integer, description: "**Shine only.** Unix seconds." }
        duration:
          type: number
          description: |
            **Shine only.** Seconds, `0` for permanent. Can be a float far
            beyond any real span (`6e+24`).
        banned_by:
          type: string
          description: '**Shine only.** `Console` when banned from the web admin or the console.'

    BanList:
      type: object
      required: [source, now, bans]
      properties:
        source:
          type: string
          enum: [vanilla, shine]
          description: Which table the bans were read from.
        now:
          type: integer
          description: |
            The server's clock, in unix seconds. Measure time left against
            this, not against the browser's clock.
        bans:
          type: array
          description: |
            Bans in force only, newest first: Shine's by `issued`, vanilla's
            in reverse file order (vanilla appends).
          items: { $ref: "#/components/schemas/BanEntry" }

    RecentPlayer:
      type: object
      description: |
        One player seen recently. `steamid` and `ipaddress` are spelled as in
        `Player`, on purpose.
      required:
        [steamid, name, names, ipaddress, first_seen, last_seen, played, connected]
      properties:
        steamid: { $ref: "#/components/schemas/SteamId" }
        name: { type: string, description: "The name last seen. Empty until the first one is." }
        names:
          type: array
          description: Former names, newest first, at most 5.
          items: { type: string }
        ipaddress:
          type: string
          description: |
            **The player's full IP address** at their last connection, also
            written to the file under `config://`. Empty when the engine did
            not report one. Redacted in the fixtures.
          examples: ["0.0.0.0"]
        first_seen: { type: integer, description: "Unix seconds, within the window." }
        last_seen: { type: integer, description: "Unix seconds. `now` while connected." }
        played:
          type: number
          description: Seconds connected within the window, summed over sessions.
        connected: { type: boolean }

    RecentPlayers:
      type: object
      required: [now, window, capacity, storage, players]
      properties:
        now:
          type: integer
          description: The server's clock, in unix seconds.
        window:
          type: integer
          description: How far back the list reaches, in seconds (86400).
        capacity:
          type: integer
          description: At most this many players are kept (100); the oldest go first.
        storage:
          type: object
          required: [loaded]
          properties:
            loaded:
              type: string
              enum: [ok, fallback, empty, unreadable]
              description: |
                How this map's load went. `fallback`: the newest save was torn
                and the one before it was used. `empty`: no file yet.
                `unreadable`: both saves were torn, so the list started empty.
            saved_at:
              type: integer
              description: Unix seconds of the last successful save. Absent before the first.
            error:
              type: string
              description: |
                Why the last save failed. Absent while saves work. When present,
                the list will not survive the next map change.
        players:
          type: array
          description: Most recently seen first.
          items: { $ref: "#/components/schemas/RecentPlayer" }

    BanRecord:
      type: object
      required: [name, id, reason, time]
      properties:
        name: { type: string }
        id:
          description: |
            A number from vanilla; a digit string when Shine's ban plugin
            has replaced the list. Compare as numbers.
          oneOf:
            - { $ref: "#/components/schemas/SteamId" }
            - { type: string, pattern: "^[0-9]+$" }
        reason: { type: string }
        time:
          type: number
          description: |
            Unix timestamp at which the ban expires; **`0` means permanent**.
            Expired bans are never pruned from the list -- filter client-side.
            An integer from vanilla. Under Shine it can be a float far beyond
            any real date (`6e+24` seen) for an effectively permanent ban.
      examples:
        - { name: Skulkovich, id: 10000000, reason: Griefing, time: 1788620201 }
        - { name: Onosaurus, id: "10000001", reason: Griefing, time: 0 }

    ReservedSlotEntry:
      type: object
      required: [name, id]
      properties:
        name: { type: string, description: '`"None"` when added without one.' }
        id: { $ref: "#/components/schemas/SteamId" }

    ReservedSlots:
      type: object
      description: |
        `GetReservedSlotData()`. Both keys are absent when the server has no
        reserved-slot config, so the reply can be `{}`.

        Slots are keyed by **name** on the server, so adding a slot under a
        name that is already present replaces that slot.
      properties:
        amount: { type: integer, minimum: 0 }
        ids:
          type: array
          items: { $ref: "#/components/schemas/ReservedSlotEntry" }
        shine:
          type: object
          description: |
            **Mod only**, and only while Shine's reservedslots plugin is on.
            Then Shine sets the count (`sh_setresslots`) and grants access by
            permission, so `amount` and `ids` are not what is enforced.
          required: [slots]
          properties:
            slots: { type: integer, minimum: 0 }

    ChatMessage:
      type: object
      required: [id, message, player, steamId, team, teamOnly]
      properties:
        id:
          type: integer
          description: |
            Increasing within a map: the counter is Lua state, so it restarts
            from 1 at every map change. Poll for ids higher than the last seen;
            a jump means messages fell out of the 20-entry buffer.
        message: { type: string }
        player: { type: string }
        steamId:
          allOf: [{ $ref: "#/components/schemas/SteamId" }]
          description: |
            Camel-cased here, `steamid` in `player_list` and `id` in a ban
            record -- three spellings for the same value.
        team: { $ref: "#/components/schemas/TeamNumber" }
        teamOnly: { type: boolean }

    ChatEntry:
      type: object
      description: One entry of the mod's chat ring. **Mod only.**
      required: [id, time, message, player, steamId, team, teamOnly]
      additionalProperties: false
      properties:
        id: { type: integer, description: "Increasing within a map, from 1." }
        time: { type: integer, description: "`Shared.GetSystemTime()`, unix seconds, when it was recorded." }
        message: { type: string }
        player: { type: string, description: "`Admin` for sv_say and sv_tsay." }
        steamId: { $ref: "#/components/schemas/SteamId" }
        team:
          allOf: [{ $ref: "#/components/schemas/TeamNumber" }]
          description: The team it was said to; 0 for sv_say.
        teamOnly: { type: boolean }

    ChatStream:
      type: object
      description: A page of the mod's chat ring, from `getchatlist&since=`. **Mod only.**
      required: [entries, last_id, dropped, buffer_size]
      additionalProperties: false
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ChatEntry" }
        last_id: { type: integer, description: "Pass as `since` on the next poll." }
        dropped:
          type: integer
          description: Entries that fell out of the ring before being read, this map.
        buffer_size: { type: integer, description: "Ring capacity, 200." }

    PerfSample:
      type: object
      required: [players, tickrate, time, ent_count]
      properties:
        players: { type: integer }
        tickrate: { type: number }
        time: { type: integer, description: '`Shared.GetSystemTime()`, a unix timestamp.' }
        ent_count: { type: integer, description: "All entities, not just players." }

    PerfReport:
      type: object
      required: [window_s, capacity, loaded_at, map, windows, last_id]
      properties:
        window_s: { type: integer, description: Seconds of engine samples per window. }
        capacity: { type: integer, description: Windows kept; the oldest is dropped. }
        loaded_at:
          type: integer
          description: |
            `Shared.GetSystemTime()` when this Lua VM loaded, i.e. the map
            load. A different value means the ids restarted.
        map: { type: string }
        config:
          type: object
          description: |
            The rates the server runs at now, from the engine's latest sample.
            A runtime `tickrate`, `sendrate`, `moverate` or `interp` shows at
            once. Absent until the engine's first sample after a map load.
          required: [tickrate, moverate, sendrate, interp_ms, max_players]
          properties:
            tickrate: { type: integer }
            moverate: { type: integer }
            sendrate: { type: integer }
            interp_ms: { type: integer }
            max_players: { type: integer }
            bw_limit:
              type: integer
              description: |
                `Server.GetBwLimit()`: bytes a second per player. 09-27 engine
                and later; follows a runtime `bwlimit`. Absent on older ones.
        windows:
          type: array
          items: { $ref: "#/components/schemas/PerfWindow" }
        last_id:
          type: integer
          description: |
            The last window in this reply when `more`, else the newest
            window's id; 0 before the first. Poll again with `since=<last_id>`.
        more:
          type: boolean
          description: |
            More windows are held past `last_id`: ask again at once. Absent
            from a mod that predates paging, which sends every window.
        engine: { $ref: "#/components/schemas/PerfEngine" }

    PerfEngine:
      type: object
      description: |
        The engine's own lines from `log-Server.txt`. Every record is stamped
        with the scan that found it (`time`, unix seconds): the lines carry no
        time of their own. One id sequence across all three lists. Absent
        from replies of a mod that predates it.
      required: [source, path, scan_s, last_id, now, tickstats, perfmon, events]
      properties:
        now: { type: integer, description: "The server's clock, `Shared.GetSystemTime()`." }
        source:
          type: string
          enum: [log, none]
          description: "`none` when the log is not readable here, or is a stale copy."
        path: { type: string }
        error: { type: string, description: Why the log could not be read. }
        stale: { type: boolean, description: The file opens but this server is not writing it. }
        scan_s: { type: integer, description: Seconds between scans. }
        last_id:
          type: integer
          description: |
            Poll again with `esince=<last_id>`. The last record in this reply
            when `more`, else the newest.
        more:
          type: boolean
          description: |
            More records are held past `last_id`, at most 60 a reply across
            the three lists. Absent from a mod that predates paging.
        tickstat_last_at:
          type: integer
          description: When the newest `TICKSTAT` line was found. Absent when none was since the map load.
        tickstat_said:
          type: object
          description: "The last `tickstat: on|off` the command printed, when seen since the map load."
          required: [text, time]
          properties:
            text: { type: string }
            time: { type: integer }
        tickstats:
          type: array
          items: { $ref: "#/components/schemas/Tickstat" }
        perfmon:
          type: array
          items: { $ref: "#/components/schemas/PerfmonBlock" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EngineEvent" }

    Tickstat:
      type: object
      description: |
        One `TICKSTAT|` line, field for field. A segment the parser does not
        know is counted in `unparsed` and its fields are absent.
      required: [id, time, unparsed]
      properties:
        id: { type: integer }
        time: { type: integer }
        unparsed: { type: integer }
        win_s: { type: number, description: Seconds the line covers. }
        hz: { type: number, description: Ticks delivered per second. }
        target: { type: integer, description: The configured tickrate. }
        int_p50_ms: { type: number, description: Tick spacing, median. }
        int_p99_ms: { type: number }
        int_p999_ms: { type: number }
        int_max_ms: { type: number }
        late_max_ms: { type: number }
        rearm: { type: integer }
        stretch_pct: { type: number, description: Share of ticks the server stretched. }
        gov_max: { type: integer }
        incomplete: { type: integer }
        incomplete_of: { type: integer }
        late: { type: integer }
        writers: { type: integer }
        moves: { type: integer }
        wait_p99_ms: { type: number }
        wait_max_ms: { type: number }
        wait_n: { type: integer }
        busy_pct: { type: number }
        humans: { type: integer }
        bots: { type: integer }
        snaps_per_s_human: { type: number }
        bytes_per_s_human: { type: number }
        moves_per_s_human: { type: number }
        moves_per_s_bot: { type: number }
        injected_pct: { type: number }
        move_ms_tick: { type: number }
        spec_moves_per_s: { type: number }
        spec_move_ms_tick: { type: number }
        snap_p50_bytes: { type: number }
        snap_p99_bytes: { type: number, description: "Size `bwlimit` from this: at least p99 x sendrate." }
        snap_max_bytes: { type: integer }
        choked_pct: { type: number, description: Share of updates held back by bwlimit. }
        human_move_ms_tick: { type: number }
        sendbuf_drops: { type: integer }
        rate_stepped: { type: integer, description: Players whose update rate was lowered. }
        slowest_rate: { type: number, description: The lowest update rate a player was at. }
        creations_deferred: { type: integer }

    PerfmonBlock:
      type: object
      description: |
        The engine's `perfmon:` block, printed only when `perfmon` is typed. It
        covers the last second.
      required: [id, time]
      properties:
        id: { type: integer }
        time: { type: integer }
        jitter_avg_ms: { type: number }
        jitter_max_ms: { type: number }
        jitter_n: { type: integer }
        snapshot_write_avg_ms: { type: number }
        snapshot_write_max_ms: { type: number }
        snapshot_write_n: { type: integer }
        entities_skipped: { type: integer }
        entities_total: { type: integer }
        entities_skipped_pct: { type: number }
        rejected_time_credit: { type: integer }
        rejected_other: { type: integer }
        rewound_missing: { type: integer }
        score: { type: integer }
        idle_pct: { type: number }
        delivery_pct: { type: number }
        overload_pct: { type: number }
        updates: { type: integer }
        warn: { type: integer }
        fail: { type: integer }

    EngineEvent:
      oneOf:
        - type: object
          description: "`client N: snapshot rate A -> B/s (...)`: a player's update rate stepped."
          required: [id, time, kind, client, from_rate, to_rate, choked_pct, clear_ms, bwlimit]
          properties:
            id: { type: integer }
            time: { type: integer }
            kind: { const: rate }
            client: { type: integer, description: A slot number, not an identity. }
            from_rate: { type: number }
            to_rate: { type: number }
            choked_pct: { type: number }
            clear_ms: { type: number }
            bwlimit: { type: integer }
        - type: object
          description: The engine's warning that bwlimit leaves too few bytes per snapshot.
          required: [id, time, kind, bwlimit, sendrate, per_snapshot, needed, suggested]
          properties:
            id: { type: integer }
            time: { type: integer }
            kind: { const: bwlimit_low }
            bwlimit: { type: integer }
            sendrate: { type: integer }
            per_snapshot: { type: integer }
            needed: { type: integer }
            suggested: { type: integer, description: The bwlimit the engine says avoids it. }

    PerfWindow:
      type: object
      required: [id, time, duration_ms, ticks, tickrate, worst_tick_ms, players,
                 score, quality, idle_pct, moves_pct, entities_pct, moves_per_s,
                 entities, incomplete, interp_warns, interp_fails, lua_kb]
      properties:
        id: { type: integer }
        time: { type: integer, description: "`Shared.GetSystemTime()` when the window closed." }
        duration_ms: { type: integer, description: The engine samples' total duration. }
        ticks: { type: integer, description: "`UpdateServer` calls in the window." }
        tickrate: { type: number, description: "`ticks` over the window's real duration." }
        worst_tick_ms: { type: number, description: The longest single tick. }
        players: { type: integer }
        score:
          type: integer
          description: |
            The engine's performance score, -99 to 100, higher better; perfmon
            colours it green from 10, yellow from 0, orange from -10, red
            below. 0 with nobody on the server, where it means nothing.
        quality: { type: integer, description: "0-100; 0 with nobody on the server." }
        idle_pct: { type: number }
        moves_pct: { type: number, description: Share of the window spent on player moves. }
        entities_pct: { type: number, description: Share spent updating other entities. }
        moves_per_s: { type: number }
        move_ms: { type: number, description: Average cost of one move. Absent with no moves. }
        entities: { type: integer, description: Average entity count. }
        incomplete: { type: integer, description: "`GetIncompleteCount()` over the window." }
        interp_warns:
          type: integer
          description: Late updates to a player (interval > 0.75 x interp), counted over the window.
        interp_fails:
          type: integer
          description: Updates at or past interp, counted over the window. Should stay 0.
        lua_kb: { type: integer, description: "`collectgarbage(\"count\")`: the Lua heap." }

    InstalledMod:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/ModId" }
        name:
          type: string
          description: |
            The workshop title. For a mod the server holds no details of, the
            engine gives its decimal workshop id instead (`"1423731186"` on the
            rig, a download that never completed).
        active:
          type: boolean
          description: |
            **Mod only.** Mounted now. Fixed when the map loads: the cycle's
            global `mods`, the loaded map's own `mods`, and two hotfix mods
            (UWE Hotfix 344, NSL Badges) that the engine mounts with no cycle
            entry. A cycle edit changes it only at the next map change.
            Measured on the 09-26 rig with Shine and 23 mods.

    MapListEntry:
      type: object
      required: [name, modId]
      properties:
        name: { type: string, examples: [ns2_summit] }
        modId:
          allOf: [{ $ref: "#/components/schemas/ModId" }]
          description: '`"0"` for a stock map, otherwise the mod that provides it.'

    MapCycleEntry:
      description: |
        Either a bare map name, or an object naming the mods that map needs.
        The shipped panel writes the object form only when a map's `modId` is
        not already in the cycle-wide `mods` array (`mapcycle.js:123-138`).
      oneOf:
        - type: string
          examples: [ns2_summit]
        - type: object
          required: [map]
          description: |
            Shine's mapvote reads further keys here (`min`, `max`, `chance`,
            `percent`, `time`, `rounds`, ...). The game ignores them and the
            mod passes them through; a client must keep them.
          additionalProperties: true
          properties:
            map: { type: string }
            mods:
              type: array
              items: { $ref: "#/components/schemas/ModId" }

    MapCycle:
      type: object
      description: |
        `config://MapCycle.json` with mod ids hex-encoded. Read it, edit it and
        write the whole document back with `setmapcycle`; there is no partial
        update. A stock 17-map cycle is 263 bytes.

        `ModIdsFromHex` **skips any string containing `:`**, which is how an
        entry can name a non-workshop source and survive the round trip.

        Other keys are allowed and must survive a round trip: Shine's mapvote
        reads map `groups` from here, for one. The 2012 panel rebuilds the
        cycle from its own fields on every save and drops them.
      additionalProperties: true
      properties:
        maps:
          type: array
          items: { $ref: "#/components/schemas/MapCycleEntry" }
        time:
          type: number
          description: Minutes before the cycle advances.
        mode:
          type: string
          description: |
            `order` plays the list in sequence; `random` shuffles. The panel
            writes only these two (`mapcycle.js:117`).
          examples: [order, random]
        mods:
          type: array
          description: Mods mounted for the whole cycle, hex ids.
          items: { $ref: "#/components/schemas/ModId" }
        groups:
          type: array
          description: Shine's mapvote map groups. Opaque to the game.

    MapCycleWrite:
      description: The mod's answer to `setmapcycle`.
      oneOf:
        - type: object
          required: [ok, cycle]
          additionalProperties: false
          properties:
            ok: { const: true }
            cycle:
              allOf: [{ $ref: "#/components/schemas/MapCycle" }]
              description: '`config://MapCycle.json` read back after the write, hex-encoded.'
        - type: object
          required: [ok, error]
          additionalProperties: false
          properties:
            ok: { const: false }
            error:
              type: string
              description: 'Why nothing was written, e.g. `mods[1] is not a hex mod id: zzzz`.'

    MapVote:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        maps_from_cycle: { type: boolean }
        round_limit: { type: integer, minimum: 0 }
        next_map: { type: string }
        options:
          type: array
          items: { type: string }

    Whitelist:
      type: object
      required: [now]
      additionalProperties: false
      properties:
        now: { type: integer, description: "The server's clock, Unix seconds." }
        hotfix_list_id: { $ref: "#/components/schemas/DecimalWorkshopId" }
        branch: { type: string, enum: [live, beta] }
        whitelist_id: { $ref: "#/components/schemas/DecimalWorkshopId" }
        fetching: { type: boolean }
        error: { type: string }
        read_at: { type: integer, description: "When the lists were read, Unix seconds." }
        whitelist:
          type: array
          items: { $ref: "#/components/schemas/DecimalWorkshopId" }
        hotfix:
          type: array
          items: { $ref: "#/components/schemas/DecimalWorkshopId" }

    DecimalWorkshopId:
      type: string
      pattern: "^[0-9]+$"
      description: A workshop id in decimal, as in a Steam URL.
      examples: ["2909200101"]

    WorkshopItem:
      type: object
      description: One workshop search hit, as `Server.SearchWorshop` returns it.
      required:
        [id, title, description, authorid, filesize, tags, steamresult,
         childcount, thumbnailurl, version]
      properties:
        id:
          allOf: [{ $ref: "#/components/schemas/ModId" }]
          description: Hex-encoded on the way out, line 260. Feed it to `installmod`.
        title: { type: string }
        description: { type: string, description: "Steam BBCode, not HTML. Escape before rendering." }
        authorid:
          type: string
          description: |
            The author's 64-bit SteamID64, as a **string** -- unlike `steamid`
            in `player_list`, which is a number.
          examples: ["76561197980112344"]
        filesize: { type: integer, description: "Bytes." }
        tags: { type: string, description: "Comma-separated, possibly empty." }
        steamresult: { type: integer, description: "Steam's own result code; `1` is OK." }
        childcount: { type: integer }
        thumbnailurl:
          type: string
          format: uri
          description: |
            An `images.steamusercontent.com` URL -- **off-server and HTTPS**,
            on a panel served over plain HTTP. On an isolated network these do
            not load; the client should tolerate broken thumbnails.
        version: { type: integer, description: "Unix timestamp of the item's last update." }

    ConsoleLine:
      type: object
      description: |
        One captured line. **Mod only.**
      required: [id, time, src, text]
      properties:
        id:
          type: integer
          description: |
            Increasing within one map. Poll `getConsole` with the last id seen;
            a gap larger than expected means lines were dropped.
        time: { type: integer, description: "Unix seconds, `Shared.GetSystemTime()`." }
        src:
          type: string
          enum: [audit, admin, server]
          description: |
            `audit` the dispatch receipt the game emits before every command
            created by `CreateServerAdminCommand`; `admin` a line printed
            through `ServerAdminPrint`; `server` one printed through
            `Shared.Message`. A console should show `admin` and `server` and
            can hide `audit`.
        text: { type: string }

    CommandResult:
      type: object
      description: |
        The result of `runCommand`. **Mod only.**
      required: [cmd, dispatched, lines]
      properties:
        cmd: { type: string, description: "The command line as sent." }
        dispatched:
          type: boolean
          description: |
            The command was dispatched as an admin command, proven by its audit
            line. `false` means a plain console command or no such command --
            indistinguishable on the server side.
        elapsed:
          type: number
          description: Seconds inside `Shared.ConsoleCommand`. Effectively zero.
        lines:
          type: array
          description: |
            What it printed. **Empty is not failure** -- a successful `sv_kick`
            prints nothing.
          items: { $ref: "#/components/schemas/ConsoleLine" }
        last_id: { type: integer, description: "Cursor for a following `getConsole`." }

    ConsoleStream:
      type: object
      description: |
        A page of the console buffer. **Mod only.**
      required: [lines, last_id]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/ConsoleLine" }
        last_id: { type: integer, description: "Pass as `since` on the next poll." }
        dropped:
          type: integer
          description: Lines that fell out of the ring buffer before being read.
        filtered:
          type: integer
          description: |
            Lines dropped at capture as engine noise. Zero in practice -- the
            filter list is empty because an idle server produced nothing to
            filter.
        buffer_size: { type: integer, description: "Ring capacity, 500." }

    LogLine:
      type: object
      description: One line of the log, without its newline. **Mod only.**
      # Quoted: YAML 1.1 reads a bare `off` as the boolean false.
      required: ["off", text]
      additionalProperties: false
      properties:
        "off":
          type: integer
          minimum: 0
          description: |
            Byte offset of the line in the file: unique within a file, so a
            client merges replies by it. Bytes, not characters.
        text:
          type: string
          description: |
            Verbatim, a trailing CR dropped. The engine writes bytes, not
            necessarily UTF-8; what is not valid UTF-8 arrives as such and a
            browser decodes it to U+FFFD.

    LogPage:
      type: object
      description: A stretch of `log-Server.txt`. **Mod only.**
      required: [source, path, file_id, size, from, to, lines, more, at_start,
                 tail_bytes, max_bytes]
      additionalProperties: false
      properties:
        source: { const: file }
        path: { type: string, description: "`config://log-Server.txt`." }
        file_id:
          type: string
          description: |
            The header's Date and Time, e.g. `09/28/2026 02:50:11 AM`; empty
            for a file without the header. Pass back as `file`.
        size: { type: integer, minimum: 0, description: "The file's size now, in bytes." }
        from: { type: integer, minimum: 0, description: "Offset of the first byte served." }
        to:
          type: integer
          minimum: 0
          description: |
            Offset after the last complete line served: the next `since`.
            Below `size` when a line is still being written or `more` is set.
        lines:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        more: { type: boolean, description: "Stopped at `max_bytes`; ask again at once." }
        at_start: { type: boolean, description: "`from` is 0: nothing earlier to page to." }
        reset:
          type: string
          enum: [new_file, truncated]
          description: The cursor did not fit this file; this reply is a fresh tail.
        tail_bytes: { type: integer, description: "What a tail or a page back reads, 65536." }
        max_bytes: { type: integer, description: "The most one reply serves: 65536, 262144 before 2026-10-08." }

    LogUnavailable:
      type: object
      description: |
        The log cannot be read: the engine writes it outside the config
        directory, so the file does not open -- or a file opens that the
        engine is not writing (`stale`). **Mod only.**
      required: [source, path, error]
      additionalProperties: false
      properties:
        source: { const: none }
        path: { type: string }
        stale:
          type: boolean
          description: |
            The file opened but is not this server's log: a line the mod
            printed (once per map load, on the first `getLog`) did not reach
            it. A copy an earlier run left with `-logdir` pointing at the
            config directory. Absent otherwise.
        error: { type: string, description: "What `io.open` said, or why the file is stale." }

    WorkshopSearchResult:
      description: |
        Two shapes on one status code: still loading, or settled. On stock a
        failed search is indistinguishable from a slow one (it restarts) or
        from an empty one (Steam's failure comes back as no items). With the
        mod, a search with no answer after 30 s settles with `error`.
      oneOf:
        - type: object
          title: Loading
          required: [loading]
          additionalProperties: false
          properties:
            loading: { type: boolean, const: true }
            elapsed:
              type: number
              description: Seconds since this search started. **Mod only.**
        - type: object
          title: Settled
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              maxItems: 50
              description: |
                At most 50: the engine hands over no more, whatever the page.
                Empty for no matches and for a search Steam failed alike.
              items: { $ref: "#/components/schemas/WorkshopItem" }
            done: { const: true, description: "**Mod only.**" }
            page: { type: integer, minimum: 1, description: "The page asked for. **Mod only.**" }
            count: { type: integer, minimum: 0, description: "`items` length. **Mod only.**" }
            capped:
              type: boolean
              description: |
                50 hits: the search may have found more than it returned.
                **Mod only**; absent when `error` is set.
            error:
              type: string
              description: |
                The search had no answer after 30 s. Reported once; the next
                request starts a fresh search. **Mod only.**

    InstallModResult:
      description: The mod's answer to `installmod`.
      oneOf:
        - type: object
          required: [ok, id, already_installed]
          additionalProperties: false
          properties:
            ok: { const: true }
            id:
              allOf: [{ $ref: "#/components/schemas/ModId" }]
              description: The id as sent to `Server.InstallMod`, lower case, no leading zeros.
            already_installed:
              type: boolean
              description: |
                It was in `getinstalledmodslist` already. The engine then checks
                it for an update and downloads nothing if it is current.
        - type: object
          required: [ok, error]
          additionalProperties: false
          properties:
            ok: { const: false }
            error:
              type: string
              description: 'Why nothing was sent to the engine, e.g. `Not a hex workshop id: zz`.'

